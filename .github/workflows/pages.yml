# public/ klasörünü gh-pages dalına kopyalar. GitHub Pages bu daldan yayın yapar:
# Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root)
# Site adresi: https://<kullanıcı>.github.io/<depo>/
name: GitHub Pages

on:
  push:
    branches: [main, master, claude/futbol-tiktok-live-stream-stbos6]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: public/ klasörünü gh-pages dalına kopyala
        run: |
          set -e
          cp -r public "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin gh-pages; then
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Yayın ekranı güncellendi (${GITHUB_SHA::7})"
          git push origin gh-pages
