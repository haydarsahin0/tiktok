<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <meta name="google" content="notranslate" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Taraftar Ligi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #05080f; overflow: hidden; }
    body.transparent { background: transparent; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { height: 100vh; height: 100dvh; width: calc(100dvh * 9 / 16); max-width: 100vw; max-height: calc(100vw * 16 / 9); display: block; }
    #tap { position: fixed; inset: 0; display: none; flex-direction: column; gap: 6px; align-items: center; justify-content: center; background: rgba(0,0,0,.86); color: #fff;
      font: 800 22px/1.4 "Baloo 2", system-ui, sans-serif; text-align: center; padding: 24px; z-index: 2; }
    #tap.show { display: flex; }
    #soundHint { position: fixed; left: 50%; bottom: 3%; transform: translateX(-50%); z-index: 3; background: rgba(0,0,0,.8); color: #fff;
      font: 700 16px/1.3 "Baloo 2", system-ui, sans-serif; padding: 8px 18px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
    #soundHint[hidden] { display: none; }
    #settings { margin-top: 18px; padding: 10px 22px; border-radius: 999px; background: #ffd400; color: #111; text-decoration: none; font-size: 20px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
  <div id="tap"><div id="tapTitle">📱 Tam ekran için dokun</div><small id="tapText" style="font-weight:600">Adres çubuğu gizlenir, ekran yayın boyunca kapanmaz, müzik başlar</small>
    <a id="settings" href="ayarlar.html">⚙️ Ayarlar</a></div>
  <script>
    // Yayın modu: dokununca tam ekran (adres çubuğu gizlenir), ekran kapanmaz, ses açılır
    (() => {
      const de = document.documentElement;
      const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true;
      const canFullscreen = Boolean(de.requestFullscreen || de.webkitRequestFullscreen);
      const isFullscreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const isTouch = matchMedia('(pointer: coarse)').matches;
      const tap = document.getElementById('tap');
      let lock = null;

      async function keepAwake() {
        try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => { lock = null; }; } } catch { /* desteklenmiyor */ }
      }
      function enterFullscreen() {
        const fn = de.requestFullscreen || de.webkitRequestFullscreen;
        if (!fn || isFullscreen() || standalone) return;
        try {
          const r = fn.call(de, { navigationUI: 'hide' });
          if (r && r.catch) r.catch(() => {});
        } catch { /* izin verilmedi */ }
      }
      function go() {
        tap.classList.remove('show');
        enterFullscreen();
        keepAwake();
        window.TaraftarAudio?.unlock(true);
      }

      // iPhone Safari tam ekrana izin vermez: tek yol "Ana Ekrana Ekle"
      if (!canFullscreen && !standalone) {
        document.getElementById('tapTitle').textContent = '📱 Adres çubuğunu gizlemek için';
        document.getElementById('tapText').innerHTML = 'Safari\'de <b>Paylaş</b> ⬆️ → <b>Ana Ekrana Ekle</b>,<br>sonra ana ekrandaki <b>Taraftar Ligi</b> simgesinden aç.<br><br>Şimdilik devam etmek için dokun.';
      }
      if (isTouch && !standalone) tap.classList.add('show');

      document.getElementById('settings').addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', go);

      // Gizli ayarlar kısayolu (yayında buton görünmesin): sol üst köşeye 3 kez hızlı dokun
      let corner = [];
      document.addEventListener('click', (e) => {
        if (e.clientX > innerWidth * 0.25 || e.clientY > innerHeight * 0.15) return;
        const now = Date.now();
        corner = corner.filter((t) => now - t < 1500).concat(now);
        if (corner.length >= 3) location.href = 'ayarlar.html';
      });

      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
      keepAwake();
    })();
  </script>
  <div id="soundHint" hidden>🔊 Müzik ve sesler için ekrana bir kez dokun</div>
  <script src="audio.js"></script>
  <script src="overlay.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
