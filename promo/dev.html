<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Taraftar Ligi: Dev Deviren</title>
<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-ext-600-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  html, body { margin: 0; background: #000; }
  canvas#c { display: block; width: 540px; height: 960px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
/* Taraftar Ligi — "Dev Deviren" 3D döngülü tanıtım (1080x1920, 30 fps, ~21 sn).
 * Gece, yağmurlu arena: dört büyükler bloklardan dev formalar, karşılarında küçük Çorum forması.
 * Taraftar desteğiyle Çorum büyür, son saniyede zaman donar, Fenerbahçe devi blok blok yıkılır.
 * Döngü: sonda dev geri sarılır gibi yeniden kurulur ve ilk kareye kavuşur. */
import * as THREE from 'three';
import { EffectComposer } from './vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/jsm/postprocessing/UnrealBloomPass.js';
import { BokehPass } from './vendor/jsm/postprocessing/BokehPass.js';
import { OutputPass } from './vendor/jsm/postprocessing/OutputPass.js';
import { RoomEnvironment } from './vendor/jsm/environments/RoomEnvironment.js';
import { TEAMS } from '../public/core/teams.js';

const W = 1080, H = 1920, FPS = 30;
const FONT = '"Baloo 2", "Segoe UI", Arial, sans-serif';
const EMO = '"Noto Color Emoji", "Apple Color Emoji", sans-serif';
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const main = document.getElementById('c');
const M = main.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let ctx = M;

// ---------- seslendirme ----------
const getJSON = (u) => { const x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return JSON.parse(x.responseText); };
const VO = getJSON('dev-cues.json');
const SAAT = '22:00';
const PROMO = { vo: 'dev-ses.mp3', voOffset: 0, voTrim: VO.trim, voGain: 2.4, out: 'taraftar-ligi-dev.mp4' };
const norm = (w) => w.toLocaleLowerCase('tr-TR').replace(/[^a-zçğıöşü0-9]/g, '');
function cue(word, nth = 1) { let k = 0; for (const w of VO.words) if (norm(w.w) === norm(word) && ++k === nth) return w.s; throw new Error('kelime yok: ' + word); }
const C = {
  dort: cue('Dört'), guclu: cue('güçlü'), saniyor: cue('sanıyor'),
  ama: cue('Ama'), sahada: cue('sahada'), kazandiran: cue('kazandıran'), taraftar: cue('taraftar'),
  hediye: cue('hediye'), begeni: cue('beğeni'), takimini: cue('takımını'), yukari: cue('yukarı'), tasiyor: cue('taşıyor'),
  skor: cue('Skor'), esit: cue('eşit'), son: cue('son'), saniye: cue('saniye'), ve: cue('ve'), anadolu: cue('Anadolu'), devi: cue('devi'), deviriyor: cue('deviriyor'),
  cunku: cue('Çünkü'), buyuklere: cue('büyüklere'), karsi: cue('karşı'), anadolunun: cue('Anadolunun'), bir: cue('bir'), bucuk: cue('buçuk'), kat: cue('kat'),
  takimini2: cue('takımını', 2), yorumlara: cue('yorumlara'), yaz: cue('yaz'),
  aksam: cue('akşam'), canli: cue('canlıdayız'), cunku2: cue('çünkü', 2), hala: cue('hâlâ'),
};
const DUR = Math.round((VO.duration + 0.3) * FPS) / FPS;
const FREEZE = [C.skor + 0.05, C.devi]; // zaman durur
const BREAK = C.deviriyor;               // dev yıkılır
const REBUILD = [C.cunku2 - 0.15, DUR - 0.12];

// ---------- matematik ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eIn = (t) => t * t * t;
const eInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const smooth = (t) => t * t * t * (t * (t * 6 - 15) + 10);
const bell = (t, a, b) => { const p = prog(t, a, b); return p <= 0 || p >= 1 ? 0 : Math.sin(p * Math.PI); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const fseed = (t) => Math.floor(t * FPS + 0.5);
const freezeAmt = (t) => prog(t, FREEZE[0] - 0.1, FREEZE[0] + 0.25) * (1 - prog(t, FREEZE[1], FREEZE[1] + 0.12));
// donmuş zaman: yağmur saati
const rainClock = (t) => { const a = FREEZE[0], b = FREEZE[1]; if (t <= a) return t; if (t <= b) return a + (t - a) * 0.03; return a + (b - a) * 0.03 + (t - b); };

// ---------- 2D yardımcılar ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 800, color = '#fff', align = 'center', stroke = 0, strokeColor = 'rgba(0,0,0,.85)', max = 0, alpha = 1, glow = 0, glowColor = '#000', grad = null, spacing = 0 } = o;
  let sz = size; ctx.font = `${weight} ${sz}px ${FONT}`; ctx.letterSpacing = spacing ? `${spacing}px` : '0px';
  if (max) while (sz > 10 && ctx.measureText(s).width > max) { sz -= 2; ctx.font = `${weight} ${sz}px ${FONT}`; }
  ctx.save(); ctx.globalAlpha *= alpha; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y + sz * 0.06); ctx.shadowBlur = 0; }
  if (grad) { const g = ctx.createLinearGradient(0, y - sz * 0.45, 0, y + sz * 0.4); grad.forEach((c, i) => g.addColorStop(i / (grad.length - 1), c)); ctx.fillStyle = g; } else ctx.fillStyle = color;
  ctx.fillText(s, x, y + sz * 0.06); ctx.restore(); ctx.letterSpacing = '0px';
}
const tw = (s, size) => { ctx.font = `800 ${size}px ${FONT}`; return ctx.measureText(s).width; };
function emoji(e, x, y, size, rot = 0, alpha = 1) { if (size < 2 || alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, 0, size * 0.04); ctx.restore(); }
function badge2d(tm, x, y, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = tm.colors[0]; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.fillStyle = tm.colors[1]; ctx.fillRect(x - r * 0.22, y - r, r * 0.44, r * 2); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.lineWidth = Math.max(3, r * 0.12); ctx.strokeStyle = '#fff'; ctx.stroke(); txt(tm.code, x, y, { size: r * 0.7, stroke: Math.max(4, r * 0.22), max: r * 1.7 });
}
const GOLD = ['#fff7c2', '#ffd400', '#e09a00'];
function canvasTex(w, h, draw) { const c = mk(w, h); const prev = ctx; ctx = c.getContext('2d'); draw(ctx, w, h); ctx = prev; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
const TM = Object.fromEntries(TEAMS.map((t) => [t.id, t]));
const GIANTS = ['gs', 'fb', 'bjk', 'ts'];
const HERO = 'corum', VILLAIN = 'fb';

// ================== 3D ==================
const glc = mk();
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a14, 0.0105);
const camera = new THREE.PerspectiveCamera(56, W / H, 0.3, 900);
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 30, aperture: 0.0001, maxblur: 0.0035 });
composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.5, 0.4, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const OBJ = {};
const LIGHT = {};

// bloklardan forma: tasarımı küçük bir tuvale çizip her pikseli bir küp yapar
const JPTS = [[-0.16, 0], [0, 0.11], [0.16, 0], [0.33, 0.05], [0.52, 0.24], [0.41, 0.37], [0.3, 0.29], [0.3, 0.98], [-0.3, 0.98], [-0.3, 0.29], [-0.41, 0.37], [-0.52, 0.24], [-0.33, 0.05]];
const BOX = new THREE.BoxGeometry(0.9, 0.9, 0.9);
function voxelJersey(tm, N = 38) {
  const c = mk(N, N), g = c.getContext('2d'), S = N / 1.1, ox = N / 2, oy = (N - 0.98 * S) / 2;
  g.beginPath(); JPTS.forEach(([x, y], i) => (i ? g.lineTo : g.moveTo).call(g, ox + x * S, oy + y * S)); g.closePath();
  g.fillStyle = tm.colors[0]; g.fill(); g.save(); g.clip(); g.fillStyle = tm.colors[1];
  for (const k of [1, 3]) g.fillRect(ox - 0.3 * S + (k * 0.6 * S) / 5, 0, (0.6 * S) / 5, N); g.restore();
  const shape = g.getImageData(0, 0, N, N).data;
  const m = mk(N, N), mg = m.getContext('2d'); mg.fillStyle = '#fff'; mg.font = `800 ${Math.round(N * 0.3)}px ${FONT}`; mg.textAlign = 'center'; mg.textBaseline = 'middle';
  mg.fillText(tm.code, ox, oy + 0.56 * S, N * 0.5); const mask = mg.getImageData(0, 0, N, N).data;
  const cells = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const k = (j * N + i) * 4; if (shape[k + 3] < 128) continue;
    const col = new THREE.Color(`rgb(${shape[k]},${shape[k + 1]},${shape[k + 2]})`);
    const x = i - N / 2 + 0.5, y = N - j - 0.5;
    for (const z of [-0.5, 0.5]) cells.push({ x, y, z, col });
    if (mask[k + 3] > 110) cells.push({ x, y, z: 1.35, col: new THREE.Color('#cfd3dc'), letter: true });
  }
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.32, metalness: 0.15, envMapIntensity: 0.9 });
  const mesh = new THREE.InstancedMesh(BOX, mat, cells.length);
  mesh.castShadow = true; mesh.receiveShadow = true;
  cells.forEach((cl, i) => { mesh.setColorAt(i, cl.letter ? cl.col : cl.col.clone().multiplyScalar(1.0)); });
  mesh.instanceColor.needsUpdate = true;
  const dummy = new THREE.Object3D();
  const place = () => { cells.forEach((cl, i) => { dummy.position.set(cl.x, cl.y, cl.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix); }); mesh.instanceMatrix.needsUpdate = true; };
  place();
  return { mesh, cells, N, dummy, place };
}

function text3D(str, size, grad, side = '#5a2a00', layers = 16, opts = {}) {
  const cw = 2048, chh = 420;
  const draw = (fill) => canvasTex(cw, chh, (c, w, h) => txt(str, w / 2, h / 2, { size: 300, grad: fill ? grad : null, color: '#fff', stroke: fill ? 20 : 0, strokeColor: opts.strokeColor || '#1a0a00', max: w - 60 }));
  const front = draw(true), mask = draw(false);
  const g = new THREE.Group(), geo = new THREE.PlaneGeometry(size * (cw / chh), size);
  for (let k = layers; k >= 0; k--) {
    const col = new THREE.Color(side).lerp(new THREE.Color('#000'), (k / layers) * 0.65);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: k ? mask : front, color: k ? col : new THREE.Color(1.6, 1.6, 1.6), transparent: true, alphaTest: 0.35, side: THREE.DoubleSide, fog: false, toneMapped: !!k }));
    m.position.z = -k * size * 0.02; g.add(m);
  }
  scene.add(g); return g;
}
function glowTex(col = '255,255,255') { return canvasTex(256, 256, (c) => { const g = c.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, `rgba(${col},1)`); g.addColorStop(0.3, `rgba(${col},.45)`); g.addColorStop(1, `rgba(${col},0)`); c.fillStyle = g; c.fillRect(0, 0, 256, 256); }); }
const sprite = (tex, s, o = {}) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, ...o })); sp.scale.set(s[0], s[1], 1); return sp; };

// yerleşim
const HERO_POS = V3(0, 0, 9);
const GIANT_H = 34, HERO_H = 6;
const GPOS = GIANTS.map((id, i) => { const a = [-52, -17, 17, 52][i] * (Math.PI / 180); return V3(Math.sin(a) * 36, 0, -Math.cos(a) * 36 + 2); });

async function build() {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.28;
  // gökyüzü, ay, bulut ışıltısı
  OBJ.skyMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, map: canvasTex(16, 512, (c) => { const g = c.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#020309'); g.addColorStop(0.42, '#0b1430'); g.addColorStop(0.5, '#1a1530'); g.addColorStop(1, '#030308'); c.fillStyle = g; c.fillRect(0, 0, 16, 512); }) });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), OBJ.skyMat));
  const moon = sprite(glowTex('255,90,70'), [260, 260], { fog: false, blending: THREE.AdditiveBlending, opacity: 0.55 }); moon.position.set(-60, 170, -420); scene.add(moon);
  const moonCore = new THREE.Mesh(new THREE.CircleGeometry(34, 48), new THREE.MeshBasicMaterial({ color: 0xff6a4a, fog: false, toneMapped: false })); moonCore.position.set(-60, 170, -430); moonCore.lookAt(0, 20, 0); scene.add(moonCore);
  // ıslak zemin
  const floorTex = canvasTex(1024, 1024, (c, w, h) => { c.fillStyle = '#0d1018'; c.fillRect(0, 0, w, h); const r = rng(3); for (let i = 0; i < 2600; i++) { c.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '0,0,0'},${0.02 + r() * 0.04})`; c.fillRect(r() * w, r() * h, 2 + r() * 10, 2 + r() * 10); } c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 2; for (let x = 0; x < w; x += 64) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); c.beginPath(); c.moveTo(0, x); c.lineTo(w, x); c.stroke(); } });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(10, 10);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.14, metalness: 0.55, envMapIntensity: 1.2 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // arena halkası (parlayan çizgiler)
  const ringTex = canvasTex(1024, 1024, (c, w, h) => { c.translate(w / 2, h / 2); c.strokeStyle = 'rgba(255,40,60,.9)'; c.lineWidth = 10; c.beginPath(); c.arc(0, 0, 470, 0, Math.PI * 2); c.stroke(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 430, 0, Math.PI * 2); c.stroke(); c.beginPath(); c.arc(0, 0, 120, 0, Math.PI * 2); c.stroke(); for (let i = 0; i < 48; i++) { c.rotate(Math.PI / 24); c.fillStyle = i % 2 ? 'rgba(255,40,60,.7)' : 'rgba(255,255,255,.4)'; c.fillRect(440, -6, 26, 12); } });
  const ring = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), new THREE.MeshBasicMaterial({ map: ringTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.03, 4); scene.add(ring); OBJ.ring = ring;

  // ışıklar
  scene.add(new THREE.HemisphereLight(0x6070a0, 0x101018, 0.35));
  LIGHT.moon = new THREE.DirectionalLight(0xa8b8ff, 1.3); LIGHT.moon.position.set(30, 70, 60); LIGHT.moon.castShadow = true;
  LIGHT.moon.shadow.mapSize.set(2048, 2048); Object.assign(LIGHT.moon.shadow.camera, { left: -60, right: 60, top: 60, bottom: -40, near: 10, far: 220 }); LIGHT.moon.shadow.bias = -0.0008;
  scene.add(LIGHT.moon);
  LIGHT.hero = new THREE.SpotLight(0xff5060, 320, 90, 0.5, 0.6, 1.4); LIGHT.hero.position.set(0, 30, 34); LIGHT.hero.target.position.copy(HERO_POS); scene.add(LIGHT.hero, LIGHT.hero.target);
  LIGHT.up = GIANTS.map((id, i) => { const s = new THREE.SpotLight(new THREE.Color(TM[id].colors[0]).lerp(new THREE.Color('#ffffff'), 0.35), 650, 80, 0.55, 0.7, 1.4); const p = GPOS[i]; s.position.set(p.x * 0.55, 1, p.z * 0.55 + 6); s.target.position.set(p.x, 22, p.z); scene.add(s, s.target); return s; });

  // devler
  OBJ.giants = GIANTS.map((id, i) => {
    const v = voxelJersey(TM[id]); const g = new THREE.Group(); g.add(v.mesh);
    const s = GIANT_H / (v.N * 0.9); v.mesh.scale.setScalar(s);
    g.position.copy(GPOS[i]); g.lookAt(HERO_POS.x, 0, HERO_POS.z); scene.add(g);
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(14, 15.5, 1.6, 48), new THREE.MeshStandardMaterial({ color: 0x15171f, roughness: 0.35, metalness: 0.6 })); ped.position.copy(GPOS[i]).setY(0.8); ped.receiveShadow = true; scene.add(ped);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(14.6, 0.18, 8, 64), new THREE.MeshBasicMaterial({ color: new THREE.Color(TM[id].colors[0]).multiplyScalar(2.2), toneMapped: false })); rim.rotation.x = Math.PI / 2; rim.position.copy(GPOS[i]).setY(1.62); scene.add(rim);
    return { id, v, g, s, base: GPOS[i].clone() };
  });
  // kahraman: Çorum
  { const v = voxelJersey(TM[HERO], 30); const g = new THREE.Group(); g.add(v.mesh); g.position.copy(HERO_POS); scene.add(g); OBJ.hero = { v, g, unit: 1 / (v.N * 0.9) }; }
  OBJ.heroPillar = new THREE.Mesh(new THREE.CylinderGeometry(4, 6, 80, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0xff2a3a, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
  OBJ.heroPillar.position.set(HERO_POS.x, 40, HERO_POS.z); scene.add(OBJ.heroPillar);
  OBJ.heroGlow = sprite(glowTex('255,50,70'), [30, 30], { blending: THREE.AdditiveBlending, opacity: 0.6 }); scene.add(OBJ.heroGlow);

  // fiziksel yıkım için başlangıç/son durumları hesapla
  { const gi = OBJ.giants[GIANTS.indexOf(VILLAIN)]; const r = rng(77), cl = gi.v.cells; const s = gi.s;
    gi.phys = cl.map((c) => { const lx = c.x * s, ly = c.y * s, lz = c.z * s; const vx = lx * (0.4 + r() * 0.9) + (r() - 0.5) * 6, vz = 6 + r() * 14 + (ly / GIANT_H) * 10, vy = 2 + r() * 8; return { lx, ly, lz, vx, vy, vz, rx: (r() - 0.5) * 12, rz: (r() - 0.5) * 12, delay: (1 - ly / GIANT_H) * 0.18 + r() * 0.05, rb: r() }; });
  }

  // yağmur
  { const n = 3200, pos = new Float32Array(n * 6), r = rng(5); const data = []; for (let i = 0; i < n; i++) data.push([(r() - 0.5) * 120, (r() - 0.5) * 120 + 5, r(), 26 + r() * 14]);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    OBJ.rain = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xbfd6ff, transparent: true, opacity: 0.32, toneMapped: false })); OBJ.rain.userData = data; OBJ.rain.frustumCulled = false; scene.add(OBJ.rain); }
  // taraftar telefon ışıkları (arkada tribün)
  { const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), r = rng(8); const data = [];
    for (let i = 0; i < n; i++) { const x = (r() - 0.5) * 110, row = r(), z = 40 + row * 40, y = 1 + row * 30; data.push([x, y, z, r() * 6]); const red = r() < 0.25; col.set(red ? [1, 0.2, 0.25] : [1, 0.95, 0.8], i * 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    OBJ.fans = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.0, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false })); OBJ.fans.userData = data; scene.add(OBJ.fans);
