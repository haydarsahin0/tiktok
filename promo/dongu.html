<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Taraftar Ligi döngü tanıtımı</title>
<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-ext-600-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Taraftar Ligi — döngülü tanıtım videosu (1080x1920, 30 fps).
 * Video sonu başına bağlanır: "Çünkü sen gelmezsen..." → "Senin takımın şu an kaybediyor."
 * Son kare ile ilk kare aynı sahneye kavuşur, müzik ritmi de başa kesintisiz bağlanır.
 * Her kare zamana göre deterministik çizilir: renderFrame(t). Ses: renderAudio(). render.cjs MP4 yapar. */
const W = 1080, H = 1920, FPS = 30;
const FONT = '"Baloo 2", "Segoe UI", Arial, sans-serif';
const EMO = '"Noto Color Emoji", "Apple Color Emoji", sans-serif';
const main = document.getElementById('c');
const M = main.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const LA = mk(), LB = mk(), LC = mk(), LR = mk(), LG = mk(), TT = mk(W, 640);
let ctx = LA.getContext('2d');

// ---------- seslendirme zamanları ----------
const getJSON = (u) => { const x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return JSON.parse(x.responseText); };
const VO = getJSON('dongu-cues.json');
const PROMO = { vo: 'dongu-ses.mp3', voOffset: 0, voTrim: VO.trim, voGain: 2.4, out: 'taraftar-ligi-dongu.mp4' };
const norm = (w) => w.toLocaleLowerCase('tr-TR').replace(/[^a-zçğıöşü0-9']/g, '');
function cue(word, nth = 1) {
  let k = 0;
  for (const w of VO.words) if (norm(w.w) === norm(word) && ++k === nth) return w.s;
  throw new Error('kelime bulunamadı: ' + word);
}
const C = {
  senin: cue('Senin'), kaybediyor: cue('kaybediyor'), ve: cue('Ve'), degis: cue('değiştirebilecek'), tek: cue('tek'), kisi: cue('kişi'), sensin: cue('sensin'),
  super: cue('Süper'), lig: cue('Lig'), artik: cue('artık'), tiktok: cue("TikTok'ta"), canli: cue('canlı'),
  gercek: cue('Gerçek'), puan: cue('puan'), fikstur: cue('fikstür'), ama: cue('ama'), maclari: cue('maçları'), sen: cue('sen'), oynat: cue('oynatıyorsun'),
  yoruma: cue('Yoruma'), takimini: cue('takımını'), ya: cue('ya'), plakani: cue('plakanı'), yaz: cue('yaz'), aninda: cue('anında'), sahadasin: cue('sahadasın'),
  hediye: cue('Hediye'), begen: cue('beğen'), takip: cue('takip'), hepsi: cue('Hepsi'), takimina: cue('takımına'), baski: cue('baskı'),
  baski2: cue('baskı', 2), yuzde: cue('yüzde'), besi: cue('beşi'), gecerse: cue('geçerse'), gol: cue('GOL'),
  en: cue('En'), destek: cue('destek'), veren: cue('veren'), kaptani: cue('kaptanı'), adi: cue('adı'), ekranda: cue('ekranda'), parlar: cue('parlar'),
  trabzon: cue('Trabzon'), horonla: cue('horonla'), gs: cue('Galatasaray'), aslanla: cue('aslanla'), sivas: cue('Sivas'), yigido: cue('yiğidolarla'), kutlar: cue('kutlar'),
  butun: cue('Bütün'), ayni: cue('aynı'), tablo: cue('tablo'), degisiyor: cue('değişiyor'),
  ilk: cue('İlk'), yarin: cue('yarın'), aksam: cue('akşam'), saat: cue('saat'), onda: cue('onda'), takipEt: cue('takip', 2), kacirma: cue('kaçırma'),
  cunku: cue('Çünkü'), sen2: cue('sen', 2), gelmezsen: cue('gelmezsen'),
};
// Döngü: son kelimeden kısa bir nefes sonra video başa döner
const DUR = Math.round((VO.duration + 0.3) * FPS) / FPS;

// ---------- yardımcılar ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eIn = (t) => t * t * t;
const eInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const eElastic = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
const bell = (t, a, b) => { const p = prog(t, a, b); return p <= 0 || p >= 1 ? 0 : Math.sin(p * Math.PI); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const frameSeed = (t) => Math.floor(t * FPS + 0.5);

const TEAM = {
  gs: { n: 'G.SARAY', code: 'GS', c: ['#A90432', '#FDB912'] }, fb: { n: 'F.BAHÇE', code: 'FB', c: ['#002D72', '#FFED00'] },
  bjk: { n: 'BEŞİKTAŞ', code: 'BJK', c: ['#111111', '#FFFFFF'] }, ts: { n: 'TRABZON', code: 'TS', c: ['#7A1E48', '#5DADE2'] },
  amed: { n: 'AMED', code: 'AMD', c: ['#1c7a3a', '#d7182a'] }, kas: { n: 'KASIMPAŞA', code: 'KSP', c: ['#1d3f8f', '#FFFFFF'] },
  koc: { n: 'KOCAELİ', code: 'KOC', c: ['#0a6b3a', '#111111'] }, bas: { n: 'BAŞAKŞEHİR', code: 'İBF', c: ['#f26522', '#0a2a5c'] },
  cor: { n: 'ÇORUM', code: 'ÇOR', c: ['#D71920', '#111111'] }, riz: { n: 'RİZE', code: 'RİZ', c: ['#0a7a3a', '#1f5fbf'] },
  erz: { n: 'ERZURUM', code: 'ERZ', c: ['#1f5fbf', '#FFFFFF'] }, goz: { n: 'GÖZTEPE', code: 'GÖZ', c: ['#E30613', '#FFD100'] },
  aln: { n: 'ALANYA', code: 'ALN', c: ['#f58220', '#0a7a3a'] }, gen: { n: 'GENÇLER', code: 'GEN', c: ['#c8102e', '#111111'] },
  ant: { n: 'G.ANTEP', code: 'GFK', c: ['#b0122e', '#111111'] }, sam: { n: 'SAMSUN', code: 'SAM', c: ['#c8102e', '#FFFFFF'] },
  kon: { n: 'KONYA', code: 'KON', c: ['#0a7a3a', '#FFFFFF'] }, eyp: { n: 'EYÜP', code: 'EYP', c: ['#6a2c91', '#ffd400'] },
  svs: { n: 'SİVAS', code: 'SVS', c: ['#D7182A', '#FFFFFF'] }, bur: { n: 'BURSA', code: 'BUR', c: ['#00843D', '#FFFFFF'] },
  sen: { n: 'SENİN TAKIMIN', code: '?', c: ['#ff2b3a', '#FFFFFF'] },
};
const GOLD = ['#fff7c2', '#ffd400', '#e09a00'];

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 800, color = '#fff', align = 'center', stroke = 0, strokeColor = 'rgba(0,0,0,.85)', max = 0, alpha = 1, glow = 0, glowColor = '#000', grad = null, spacing = 0 } = o;
  let sz = size;
  ctx.font = `${weight} ${sz}px ${FONT}`;
  ctx.letterSpacing = spacing ? `${spacing}px` : '0px';
  if (max) while (sz > 10 && ctx.measureText(s).width > max) { sz -= 2; ctx.font = `${weight} ${sz}px ${FONT}`; }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y + sz * 0.06); ctx.shadowBlur = 0; }
  if (grad) { const g = ctx.createLinearGradient(0, y - sz * 0.45, 0, y + sz * 0.4); grad.forEach((c, i) => g.addColorStop(i / (grad.length - 1), c)); ctx.fillStyle = g; } else ctx.fillStyle = color;
  ctx.fillText(s, x, y + sz * 0.06);
  ctx.restore();
  ctx.letterSpacing = '0px';
}
function tw(s, size, weight = 800) { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(s).width; }
// büyükten küçüğe çakılan yazı (p: 0..1)
function slam(s, x, y, p, o = {}, from = 2.4, rot = 0) {
  if (p <= 0) return;
  const sc = lerp(from, 1, eBack(clamp(p, 0, 1), 1.5));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  txt(s, 0, 0, { ...o, alpha: (o.alpha ?? 1) * clamp(p * 4, 0, 1) });
  ctx.restore();
}
// parlayan yazı: metnin üstünden ışık geçer
function shine(s, x, y, o, ph) {
  const prev = ctx; const tc = TT.getContext('2d'); ctx = tc;
  tc.setTransform(1, 0, 0, 1, 0, 0); tc.clearRect(0, 0, W, 640);
  txt(s, W / 2, 320, o);
  tc.globalCompositeOperation = 'source-atop';
  const bx = lerp(-200, W + 200, ph);
  const g = tc.createLinearGradient(bx - 90, 0, bx + 90, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  tc.fillStyle = g; tc.save(); tc.translate(bx, 320); tc.rotate(0.3); tc.fillRect(-90, -700, 180, 1400); tc.restore();
  tc.globalCompositeOperation = 'source-over';
  ctx = prev; ctx.drawImage(TT, x - W / 2, y - 320);
}
function emoji(e, x, y, size, rot = 0, alpha = 1) {
  if (size < 2 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, 0, size * 0.04); ctx.restore();
}
function bgGrad(c0, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function radial(x, y, r, col, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function rays(cx, cy, rot, col, n = 18, alpha = 0.14) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.globalAlpha *= alpha; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, w = (Math.PI / n) * 0.55; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - w) * 2600, Math.sin(a - w) * 2600); ctx.lineTo(Math.cos(a + w) * 2600, Math.sin(a + w) * 2600); ctx.fill(); }
  ctx.restore();
}
function sparkles(t, seed, n, area, col = '#fff') {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = area[0] + r() * area[2], y = area[1] + r() * area[3], ph = r(), sp = 0.6 + r() * 1.2;
    const k = Math.pow(Math.max(0, Math.sin((t * sp + ph) * Math.PI * 2)), 6);
    if (k < 0.05) continue;
    const s = 6 + r() * 16;
    ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = col; ctx.translate(x, y);
    ctx.beginPath(); ctx.moveTo(0, -s * k); ctx.lineTo(s * 0.18, 0); ctx.lineTo(0, s * k); ctx.lineTo(-s * 0.18, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * k, 0); ctx.lineTo(0, s * 0.18); ctx.lineTo(s * k, 0); ctx.lineTo(0, -s * 0.18); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function dust(t, seed, n, col, alpha = 0.5) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = (r() * W + Math.sin(t * 0.7 + i) * 30), sp = 20 + r() * 60, y = H + 40 - ((t * sp + r() * H) % (H + 80));
    ctx.globalAlpha = alpha * (0.3 + r() * 0.7); ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// analitik konfeti: patlamadan geçen süreye göre konum
function confetti(t, t0, x0, y0, colors, n, seed, spread = 1) {
  const dt = t - t0;
  if (dt < 0 || dt > 3.2) return;
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2, sp = (500 + r() * 1200) * spread;
    const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp - 700;
    const drag = 1 - Math.exp(-2.2 * dt);
    const x = x0 + (vx / 2.2) * drag, y = y0 + (vy / 2.2) * drag + 430 * dt * dt;
    const s = 10 + r() * 16, rot = r() * 6 + dt * (r() * 12 - 6);
    ctx.save(); ctx.globalAlpha = clamp(1.4 - dt / 2.3, 0, 1); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, Math.cos(dt * 9 + i));
    ctx.fillStyle = colors[i % colors.length]; ctx.fillRect(-s / 2, -s / 4, s, s / 2); ctx.restore();
  }
}
// havai fişek patlaması
function firework(t, t0, x, y, col, seed, n = 46, R = 300) {
  const dt = t - t0;
  if (dt < 0 || dt > 1.6) return;
  const r = rng(seed);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + r() * 0.1, sp = R * (0.7 + r() * 0.3);
    const k = 1 - Math.exp(-3.2 * dt);
    const px = x + Math.cos(a) * sp * k, py = y + Math.sin(a) * sp * k + 90 * dt * dt;
    const al = clamp(1.3 - dt / 1.2, 0, 1);
    ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x + Math.cos(a) * sp * k * 0.8, y + Math.sin(a) * sp * k * 0.8 + 90 * dt * dt); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  }
  if (dt < 0.15) radial(x, y, 260, col, 1 - dt / 0.15);
  ctx.restore();
}
function ring(t, t0, x, y, col, maxR = 700, w = 22, dur = 0.6) {
  const p = prog(t, t0, t0 + dur);
  if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - p; ctx.lineWidth = w * (1 - p) + 2; ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(x, y, 40 + eOut(p) * maxR, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function badge(tm, x, y, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = tm.c[0]; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.fillStyle = tm.c[1]; ctx.fillRect(x - r * 0.25, y - r, r * 0.5, r * 2); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.lineWidth = Math.max(3, r * 0.12); ctx.strokeStyle = '#fff'; ctx.stroke();
  txt(tm.code, x, y, { size: r * 0.72, stroke: Math.max(4, r * 0.2), max: r * 1.7 });
}
function jerseyPath(cx, top, w) {
  const p = [[-0.16, 0], [0, 0.11], [0.16, 0], [0.33, 0.05], [0.52, 0.24], [0.41, 0.37], [0.3, 0.29], [0.3, 0.98], [-0.3, 0.98], [-0.3, 0.29], [-0.41, 0.37], [-0.52, 0.24], [-0.33, 0.05]];
  ctx.beginPath(); p.forEach(([px, py], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, cx + px * w, top + py * w)); ctx.closePath();
}
function jersey(tm, cx, top, w) {
  ctx.save(); jerseyPath(cx, top, w); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 20; ctx.fillStyle = tm.c[0]; ctx.fill(); ctx.shadowBlur = 0; ctx.clip();
  const sw = (w * 0.6) / 5; ctx.fillStyle = tm.c[1]; for (const i of [1, 3]) ctx.fillRect(cx - w * 0.3 + i * sw, top, sw, w);
  ctx.restore();
  ctx.save(); jerseyPath(cx, top, w); ctx.lineWidth = Math.max(3, w * 0.025); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke(); ctx.restore();
  txt(tm.code, cx, top + w * 0.58, { size: w * 0.24, stroke: w * 0.06, max: w * 0.56 });
}
// tribün silüeti (alt kısım), spot ışığına yakın olanlar aydınlanır
function crowd(t, y0, base, lit = null, energy = 0, seed = 5) {
  const r = rng(seed);
  for (let row = 0; row < 6; row++) {
    const y = y0 + row * 70, hr = 24 + row * 5, step = hr * 2.3;
    for (let x = -40 + (row % 2) * step * 0.5; x < W + 60; x += step) {
      const jx = (r() - 0.5) * 18, ph = r() * 6;
      const bob = energy * Math.abs(Math.sin(t * 7 + ph)) * 26;
      const hx = x + jx, hy = y - bob;
      let col = base;
      if (lit) { const d = Math.hypot(hx - lit.x, (hy - lit.y) * 1.6); const k = clamp(1 - d / (lit.r * 1.15), 0, 1); if (k > 0) col = `rgba(${lerp(8, 120, k) | 0},${lerp(9, 115, k) | 0},${lerp(14, 105, k) | 0},1)`; }
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
      rr(hx - hr * 1.5, hy + hr * 0.8, hr * 3, 200, hr); ctx.fill();
      if (energy > 0.5 && (row + Math.floor(x)) % 3 === 0) { rr(hx + hr * 0.9, hy - hr * 2.6 - bob * 0.5, hr * 0.5, hr * 2.4, hr * 0.25); ctx.fill(); }
    }
  }
}
// tribünde fotoğraf flaşları
function flashes(t, seed, n, area, rate = 1.3) {
  const r = rng(seed);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x = area[0] + r() * area[2], y = area[1] + r() * area[3], ph = r(), sp = rate * (0.6 + r() * 0.8);
    const f = (t * sp + ph) % 1;
    if (f > 0.06) continue;
    const k = 1 - f / 0.06;
    radial(x, y, 40, 'rgba(255,255,255,.9)', k);
  }
  ctx.restore();
}

// ---------- resimler ----------
const img = (src) => { const i = new Image(); i.src = src; return i; };
const SHOT = img('../docs/mac-gunu.png'), SHOT_GOL = img('../docs/mac-gunu-gol.png'), LOGO = img('../logo/taraftar-ligi-sade.png');
const IMGS = [SHOT, SHOT_GOL, LOGO];

// ================== SAHNELER ==================
// Her sahne mutlak zaman t alır, tüm ekranı kendisi boyar.

// ---- 1) KANCA: alarm, takımın düşüyor ----
const HOOK_ROWS = [['gs', 29], ['ts', 25], ['sen', 24], ['amed', 23], ['bjk', 21], ['kas', 21], ['fb', 20], ['koc', 20], ['bas', 18]];
function sHook(t) {
  const BO = C.ve - 0.08; // ışıklar söner
  let dark = t >= BO;
  if (t >= BO && t < BO + 0.2 && Math.floor((t - BO) * 30) % 3 === 1) dark = false; // titreme
  if (!dark) hookAlarm(t); else hookDark(t);
}
function hookAlarm(t) {
  bgGrad('#1c0205', '#2c0509', '#0b0103');
  // dönen siren ışıkları
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const ph of [0, Math.PI]) {
    const a = Math.PI / 2 + Math.sin(t * 2.4 + ph) * 0.95;
    const g = ctx.createRadialGradient(540, -60, 0, 540, -60, 2100);
    g.addColorStop(0, 'rgba(255,40,50,.42)'); g.addColorStop(1, 'rgba(255,40,50,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(540, -60);
    ctx.lineTo(540 + Math.cos(a - 0.2) * 2400, -60 + Math.sin(a - 0.2) * 2400); ctx.lineTo(540 + Math.cos(a + 0.2) * 2400, -60 + Math.sin(a + 0.2) * 2400); ctx.fill();
  }
  ctx.restore();
  const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 1.6);
  radial(540, 960, 1300, 'rgba(255,0,20,.35)', 0.4 + 0.4 * pulse);
  // tarama çizgileri
  ctx.fillStyle = 'rgba(255,255,255,.035)'; for (let y = (t * 120) % 8; y < H; y += 8) ctx.fillRect(0, y, W, 2);
  // SON DAKİKA bandı
  const by = 262;

const SUB_Y = 1488;
function subtitles(t) {

  let size = 76, gap = Math.round(size * 0.5);
  ctx.font = `800 ${size}px ${FONT}`;
  let widths = words.map((w) => ctx.measureText(w).width);
  let total = widths.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  if (total > 900) { size = Math.floor((size * 900) / total); gap = Math.round(size * 0.5); ctx.font = `800 ${size}px ${FONT}`; widths = words.map((w) => ctx.measureText(w).width); total = widths.reduce((a, b) => a + b, 0) + gap * (words.length - 1); }
