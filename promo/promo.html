<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Taraftar Ligi tanıtım videosu</title>
<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-ext-600-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Taraftar Ligi — tanıtım videosu (1080x1920, 30 fps, 27 sn).
 * Her kare zamana göre deterministik çizilir: renderFrame(t). Ses: renderAudio() (OfflineAudioContext).
 * render.cjs kareleri ve sesi alıp ffmpeg ile MP4 yapar. */
const W = 1080, H = 1920, FPS = 30;
const FONT = '"Baloo 2", "Segoe UI", Arial, sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- seslendirme ve zaman çizelgesi ----------
// vo-cues.json: seslendirmedeki her kelimenin başlangıç/bitiş zamanı (Whisper + enerji analiziyle).
// Bütün animasyonlar ve altyazılar bu zamanlara bağlıdır.
const VO_OFFSET = 0.6; // seslendirme videonun 0,6. saniyesinde başlar (top önce düşsün)
const VO = (() => { try { const x = new XMLHttpRequest(); x.open('GET', 'vo-cues.json', false); x.send(); return JSON.parse(x.responseText); } catch { return null; } })();
const norm = (w) => w.toLocaleLowerCase('tr-TR').replace(/[^a-zçğıöşü0-9']/g, '');
function cue(word, nth = 1) {
  let k = 0;
  for (const w of VO.words) if (norm(w.w) === norm(word) && ++k === nth) return w.s + VO_OFFSET;
  throw new Error('kelime bulunamadı: ' + word);
}
const C = {
  takimini: cue('Takımını'), sen: cue('sen'), sampiyon: cue('şampiyon'), tiktok: cue("TikTok'ta"), superlig: cue('Süper'),
  chat: cue('Yoruma'), plaka: cue('plakasını'), taraftari: cue('taraftarı'),
  press: cue('Hediye'), begen: cue('beğen'), takip: cue('takip'), baski: cue('baskı'),
  goal: cue('Tur'), uc: cue('üç'), iki: cue('iki'), bir: cue('bir'), gol: cue('Gol'), yuzde: cue('Yüzde'), gecen: cue('geçen'),
  screen: cue('Gerçek'), tablo: cue('canlı', 2), hafta: cue('Haftanın'),
  celebs: cue('Her', 2), horon: cue('Horon'), aslan: cue('aslan'), timsah: cue('timsah'), yigido: cue('Yiğido'),
  cta: cue('İlk'), saat: cue('saat'), takipEt: cue('Takip', 2), yalniz: cue('takımını', 2),
};
const DUR = Math.ceil((VO.duration + VO_OFFSET + 1.0) * 10) / 10;
const LEAD = 0.12; // sahne, cümleden biraz önce başlasın (geçiş şeridi tam kelimede açılsın)
const SC = {
  hook: [0, C.chat - LEAD], chat: [C.chat - LEAD, C.press - LEAD], press: [C.press - LEAD, C.goal - LEAD],
  goal: [C.goal - LEAD, C.screen - LEAD], screen: [C.screen - LEAD, C.celebs - LEAD],
  celebs: [C.celebs - LEAD, C.cta - LEAD], cta: [C.cta - LEAD, DUR],
};
const rel = (k, t) => t - SC[k][0]; // mutlak zamanı sahne içi zamana çevir
const CHAT_T = [0.35, 0.8, 1.25, 1.7, 2.15, 2.6];
// hediyeler kelimelerle uçar: "Hediye at", "beğen", "takip et", ..., "baskı puanı"
const GIFT_T = [rel('press', C.press) + 0.45, rel('press', C.begen) + 0.15, rel('press', C.takip) + 0.2,
  rel('press', C.takip) + 0.75, rel('press', C.takip) + 1.25, rel('press', C.baski) + 0.1];
const GOAL_AT = rel('goal', C.gol);
const CUTS = [C.horon, C.aslan, C.timsah, C.yigido].map((t) => rel('celebs', t));

// ---------- yardımcılar ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t, s = 1.9) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const eElastic = (t) => (t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const TEAM = {
  fb: { name: 'FENERBAHÇE', short: 'F.BAHÇE', code: 'FB', c: ['#002D72', '#FFED00'] },
  gs: { name: 'GALATASARAY', short: 'G.SARAY', code: 'GS', c: ['#A90432', '#FDB912'] },
  bjk: { name: 'BEŞİKTAŞ', short: 'BEŞİKTAŞ', code: 'BJK', c: ['#111111', '#FFFFFF'] },
  ts: { name: 'TRABZONSPOR', short: 'TRABZON', code: 'TS', c: ['#7A1E48', '#5DADE2'] },
  corum: { name: 'ÇORUM FK', short: 'ÇORUM', code: 'ÇOR', c: ['#D71920', '#111111'] },
  sivas: { name: 'SİVASSPOR', short: 'SİVAS', code: 'SVS', c: ['#D7182A', '#FFFFFF'] },
  goztepe: { name: 'GÖZTEPE', short: 'GÖZTEPE', code: 'GÖZ', c: ['#E30613', '#FFD100'] },
  bursa: { name: 'BURSASPOR', short: 'BURSA', code: 'BUR', c: ['#00843D', '#FFFFFF'] },
};

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 800, color = '#fff', align = 'center', stroke = 0, strokeColor = 'rgba(0,0,0,.85)', max = 0, alpha = 1, base = 'middle', glow = 0, glowColor = '#000' } = o;
  let sz = size;
  ctx.font = `${weight} ${sz}px ${FONT}`;
  if (max) while (sz > 10 && ctx.measureText(s).width > max) { sz -= 2; ctx.font = `${weight} ${sz}px ${FONT}`; }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); ctx.shadowBlur = 0; }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function popTxt(s, x, y, t, o = {}) {
  // t: 0..1 giriş ilerlemesi; büyükten küçüğe "çakılma"
  if (t <= 0) return;
  const k = o.from ?? 2.2;
  const sc = lerp(k, 1, eBack(clamp(t, 0, 1), 1.4));
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  txt(s, 0, 0, { ...o, alpha: (o.alpha ?? 1) * clamp(t * 3, 0, 1) });
  ctx.restore();
}
function stripes(x, y, w, h, colors, count = 3) {
  ctx.fillStyle = colors[0]; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = colors[1];
  const sw = w / (count * 2 - 1);
  for (let i = 1; i < count * 2 - 1; i += 2) ctx.fillRect(x + i * sw, y, sw, h);
}
function jerseyPath(cx, top, w) {
  const p = [[-0.16, 0], [0, 0.11], [0.16, 0], [0.33, 0.05], [0.52, 0.24], [0.41, 0.37], [0.3, 0.29], [0.3, 0.98], [-0.3, 0.98], [-0.3, 0.29], [-0.41, 0.37], [-0.52, 0.24], [-0.33, 0.05]];
  ctx.beginPath(); p.forEach(([px, py], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, cx + px * w, top + py * w)); ctx.closePath();
}
function jersey(t, cx, top, w) {
  ctx.save(); jerseyPath(cx, top, w); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 24; ctx.fillStyle = t.c[0]; ctx.fill(); ctx.shadowBlur = 0; ctx.clip();
  stripes(cx - w * 0.3, top, w * 0.6, w, t.c, 3); ctx.fillStyle = t.c[0]; ctx.fillRect(cx - w * 0.6, top, w * 0.3, w * 0.45); ctx.fillRect(cx + w * 0.3, top, w * 0.3, w * 0.45); ctx.restore();
  ctx.save(); jerseyPath(cx, top, w); ctx.lineWidth = Math.max(3, w * 0.025); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke(); ctx.restore();
  txt(t.code, cx, top + w * 0.58, { size: w * 0.24, stroke: w * 0.06, max: w * 0.56 });
}
function badge(t, x, y, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip(); stripes(x - r, y - r, r * 2, r * 2, t.c, 3); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.lineWidth = Math.max(3, r * 0.12); ctx.strokeStyle = '#fff'; ctx.stroke();
  txt(t.code, x, y + 2, { size: r * 0.7, stroke: Math.max(4, r * 0.18), max: r * 1.7 });
}
function emoji(e, x, y, size, rot = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px "Noto Color Emoji", "Apple Color Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, 0, 0); ctx.restore();
}

// Konfeti: analitik (durumsuz) — patlama anından geçen süreye göre konum
function confetti(t, t0, x0, y0, colors, n, seed, spread = 1) {
  const dt = t - t0;
  if (dt < 0 || dt > 3.2) return;
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2;
    const sp = (500 + r() * 1100) * spread;
    const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp - 650;
    const drag = 1 - Math.exp(-2.2 * dt);
    const x = x0 + (vx / 2.2) * drag;
    const y = y0 + (vy / 2.2) * drag + 420 * dt * dt;
    const rot = r() * 6 + dt * (r() * 10 - 5);
    const s = 10 + r() * 14;
    ctx.save(); ctx.globalAlpha = clamp(1.4 - dt / 2.3, 0, 1); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = colors[i % colors.length]; ctx.fillRect(-s / 2, -s / 4, s, s / 2); ctx.restore();
  }
}

// ---------- arka plan ----------
function background(t, tint = null) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#040a18'); g.addColorStop(0.55, '#0b2236'); g.addColorStop(1, '#03140c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
  // dönen stadyum ışıkları
  for (const [side, ph] of [[-1, 0], [1, 1.7]]) {
    const x = side < 0 ? 60 : W - 60;
    const ang = Math.sin(t * 0.9 + ph) * 0.35;
    ctx.save(); ctx.translate(x, 120); ctx.rotate(ang * side);
    const lg = ctx.createLinearGradient(0, 0, 0, 1700);
    lg.addColorStop(0, 'rgba(255,250,220,.20)'); lg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(side * -420 - 260, 1700); ctx.lineTo(side * -420 + 260, 1700); ctx.lineTo(20, 0); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, 120, 16, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,230,.9)'; ctx.fill();
  }
  // yükselen parıltılar
  const r = rng(7);
  for (let i = 0; i < 46; i++) {
    const x = r() * W; const sp = 30 + r() * 70; const y = (H + 40) - ((t * sp + r() * H) % (H + 80));
    ctx.globalAlpha = 0.15 + r() * 0.35; ctx.fillStyle = r() < 0.5 ? '#ffd400' : '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 2 + r() * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // saha çizgisi dokusu (altta)
  ctx.save(); ctx.globalAlpha = 0.07; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(W / 2, 1780, 260, Math.PI, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 1780); ctx.lineTo(W, 1780); ctx.stroke(); ctx.restore();
}

// Sahne başlığı: numara + iki satır
function header(lt, num, l1, l2, y = 300) {
  const p = eOut(prog(lt, 0.05, 0.45));
  if (num) {
    const s = eBack(prog(lt, 0.05, 0.4), 2);
    ctx.save(); ctx.translate(540, y - 120); ctx.scale(s, s);
    ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.fillStyle = '#ffd400'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke();
    txt(num, 0, 4, { size: 74, color: '#111' }); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = p; ctx.translate(lerp(-80, 0, p), 0);
  txt(l1, 540, y, { size: 72, stroke: 12, max: 940 }); ctx.restore();
  const p2 = eOut(prog(lt, 0.18, 0.6));
  ctx.save(); ctx.globalAlpha = p2; ctx.translate(lerp(80, 0, p2), 0);
  txt(l2, 540, y + 96, { size: 92, stroke: 14, color: '#ffd400', max: 960 }); ctx.restore();
}

// Sahne geçişi: takım renkli eğik şeritler ekranı süpürür
function wipe(t) {
  const cuts = [SC.chat[0], SC.press[0], SC.goal[0], SC.screen[0], SC.celebs[0], SC.cta[0]];
  const cols = [['#c8102e', '#ffd400', '#0a2a66'], ['#002D72', '#FFED00', '#c8102e'], ['#A90432', '#FDB912', '#111'], ['#7A1E48', '#5DADE2', '#ffd400'], ['#111', '#fff', '#c8102e'], ['#c8102e', '#fff', '#ffd400']];
  cuts.forEach((c, i) => {
    const p = prog(t, c - 0.28, c + 0.28);
    if (p <= 0 || p >= 1) return;
    const x = lerp(-1700, 1700, eInOut(p));
    ctx.save(); ctx.translate(x, 0); ctx.rotate(-0.22);
    cols[i].forEach((col, j) => { ctx.fillStyle = col; ctx.fillRect(-500 + j * 260, -400, 300, H + 1200); });
    ctx.restore();
  });
}

// ---------- SAHNE 1: kanca ----------
function sceneHook(lt) {
  // lt = mutlak zaman (sahne 0'da başlar). Top "Takımını" kelimesinde yere çarpar.
  const I = C.takimini - 0.04;
  const drop = prog(lt, 0, I);
  let by = lerp(-180, 1050, drop * drop);
  if (lt > I) { const b = prog(lt, I, I + 0.45); by = 1050 - Math.sin(b * Math.PI) * 170; }
  if (lt > I + 0.45) { const b = prog(lt, I + 0.45, I + 0.75); by = 1050 - Math.sin(b * Math.PI) * 50; }
  const bscale = 1 - eInOut(prog(lt, C.tiktok - 0.35, C.tiktok - 0.05));
  if (bscale > 0.01) emoji('⚽', 540, by, 210 * bscale, lt * 7);
  const f = prog(lt, I, I + 0.35);
  if (f > 0 && f < 1) {
    ctx.save(); ctx.globalAlpha = (1 - f) * 0.55; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
    ctx.save(); ctx.globalAlpha = 1 - f; ctx.lineWidth = 18 * (1 - f); ctx.strokeStyle = '#ffd400';
    ctx.beginPath(); ctx.arc(540, 1120, 80 + f * 700, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  confetti(lt, I, 540, 1100, ['#ffd400', '#c8102e', '#fff', '#5DADE2'], 120, 11, 1.1);
  // logo
  const lp = eBack(prog(lt, C.sampiyon + 0.45, C.sampiyon + 0.8), 2);
  if (lp > 0) {
    ctx.save(); ctx.translate(540, 250); ctx.scale(lp, lp);
    rr(-260, -50, 520, 100, 50); ctx.fillStyle = '#c8102e'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-200, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8102e'; ctx.beginPath(); ctx.arc(-189, 0, 27, 0, Math.PI * 2); ctx.fill();
    emoji('⚽', -200, 2, 34);
    txt('TARAFTAR LİGİ', 30, 4, { size: 56, stroke: 8 });
    ctx.restore();
  }
  // kelimelerle çakılan başlık
  popTxt('TAKIMINI', 540, 520, prog(lt, C.takimini, C.takimini + 0.35), { size: 128, stroke: 16 });
  const sp = prog(lt, C.sen, C.sen + 0.3);
  if (sp > 0) {
    const sc = lerp(2.4, 1, eBack(sp, 1.4));
    ctx.save(); ctx.translate(540, 672); ctx.scale(sc, sc); ctx.rotate(-0.04);
    rr(-150, -78, 300, 156, 30); ctx.fillStyle = '#c8102e'; ctx.globalAlpha = clamp(sp * 3, 0, 1); ctx.fill();
    txt('SEN', 0, 6, { size: 150, stroke: 0 }); ctx.restore();
  }
  popTxt('ŞAMPİYON YAP!', 540, 840, prog(lt, C.sampiyon, C.sampiyon + 0.35), { size: 124, stroke: 16, color: '#ffd400', max: 1000 });
  // "TikTok'ta canlı Süper Lig başlıyor!"
  const sub = eOut(prog(lt, C.tiktok, C.tiktok + 0.4));
  if (sub > 0) {
    ctx.save(); ctx.globalAlpha = sub; ctx.translate(0, lerp(60, 0, sub));
    rr(150, 980, 780, 92, 46); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(205, 1026, 14, 0, Math.PI * 2); ctx.fillStyle = Math.floor(lt * 4) % 2 ? '#ff3b3b' : '#a00'; ctx.fill();
    txt("TikTok'ta CANLI Süper Lig oyunu", 560, 1028, { size: 46, max: 680 });
    ctx.restore();
  }
  ['gs', 'fb', 'bjk', 'ts'].forEach((id, i) => {
    const p = eBack(prog(lt, C.superlig + i * 0.12, C.superlig + 0.4 + i * 0.12), 1.6);
    if (p <= 0) return;
    const x = 210 + i * 220;
    ctx.save(); ctx.globalAlpha = clamp(p, 0, 1); ctx.translate(0, lerp(260, 0, p));
    jersey(TEAM[id], x, 1140 + Math.sin(lt * 4 + i) * 6, 170); ctx.restore();
  });
}

// ---------- SAHNE 2: yorum yaz ----------
const CHATS = [
  { n: 'Mert', m: 'fener 💛💙', t: 'fb' },
  { n: 'Ayşe', m: 'cimbom 🦁', t: 'gs' },
  { n: 'Karadeniz61', m: '61', t: 'ts' },
  { n: 'Can', m: 'bjk', t: 'bjk' },
  { n: 'Yiğido58', m: 'sivas', t: 'sivas' },
  { n: 'Ece', m: 'göz göz', t: 'goztepe' },
];
function sceneChat(lt) {
  header(lt, '1', 'Yoruma takımının', 'ADINI YAZ!');
  // TikTok benzeri yorum alanı
  const pa = eOut(prog(lt, 0.1, 0.4));
  ctx.save(); ctx.globalAlpha = pa;
  rr(90, 520, 900, 800, 40); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
  txt('💬 Canlı yorumlar', 140, 570, { size: 34, align: 'left', color: '#cfd8e8', weight: 600 });
  ctx.restore();
  const shown = CHATS.filter((_, i) => lt >= CHAT_T[i]);
  const ROW = 118;
  shown.forEach((c, i) => {
    const age = lt - CHAT_T[i];
    const fromBottom = shown.length - 1 - i; // en yeni en altta
    const targetY = 1230 - fromBottom * ROW;
    const p = eBack(clamp(age / 0.35, 0, 1), 1.6);
    const y = targetY + (1 - clamp(age / 0.25, 0, 1)) * 60;
    if (y < 600) return;
    const tm = TEAM[c.t];
    ctx.save(); ctx.translate(140, y); ctx.scale(lerp(0.6, 1, p), lerp(0.6, 1, p)); ctx.globalAlpha = clamp(age / 0.15, 0, 1);
    ctx.beginPath(); ctx.arc(34, 0, 38, 0, Math.PI * 2); ctx.fillStyle = tm.c[0]; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = tm.c[1]; ctx.stroke();
    txt(c.n[0], 34, 4, { size: 40, stroke: 6 });
    txt(c.n, 92, -20, { size: 28, align: 'left', color: '#aab4c8', weight: 600 });
    txt(c.m, 92, 20, { size: 44, align: 'left' });
    ctx.restore();
    // "→ takım taraftarı!" etiketi
    const cp = eOut(clamp((age - 0.25) / 0.3, 0, 1));
    if (cp > 0) {
      ctx.save(); ctx.globalAlpha = cp; ctx.translate(lerp(60, 0, cp), 0);
      const label = `${tm.short} ✓`;
      ctx.font = `800 32px ${FONT}`; const w = ctx.measureText(label).width + 80;
      rr(950 - w, y - 30, w, 60, 30); ctx.fillStyle = tm.c[0]; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = tm.c[1]; ctx.stroke();
      badge(tm, 950 - w + 32, y, 20);
      txt(label, 950 - w + 58, y + 2, { size: 32, align: 'left', stroke: 6 });
      ctx.restore();
    }
  });
  const pl = rel('chat', C.plaka);
  const fp = eOut(prog(lt, pl, pl + 0.35));
  if (fp > 0) {

// ---------- altyazı (konuşmayla kelime kelime eş zamanlı) ----------
const SUB_Y = 1505;
function subtitles(t) {
  const chunks = VO.chunks;
  const vt = t - VO_OFFSET;
  let idx = -1;
  for (let i = 0; i < chunks.length; i++) {
    const st = chunks[i][0].s - 0.06;
    const next = i + 1 < chunks.length ? chunks[i + 1][0].s - 0.06 : Infinity;
    const end = Math.min(next, chunks[i][chunks[i].length - 1].e + 0.45);
    if (vt >= st && vt < end) { idx = i; break; }
  }
  if (idx < 0) return;
  const ch = chunks[idx];
  const age = vt - (ch[0].s - 0.06);
  const words = ch.map((w) => w.w.toLocaleUpperCase('tr-TR'));
  let size = 74;
  let gap = Math.round(size * 0.5);
  ctx.font = `800 ${size}px ${FONT}`;
  let widths = words.map((w) => ctx.measureText(w).width);
  let total = widths.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  if (total > 940) { size = Math.floor(size * 940 / total); gap = Math.round(size * 0.5); ctx.font = `800 ${size}px ${FONT}`; widths = words.map((w) => ctx.measureText(w).width); total = widths.reduce((a, b) => a + b, 0) + gap * (words.length - 1); }
  const pop = lerp(0.82, 1, eBack(clamp(age / 0.16, 0, 1), 2));
  ctx.save();
  ctx.translate(540, SUB_Y);
  ctx.scale(pop, pop);
  // okunurluk için yumuşak koyu zemin
  const pad = 30;
  rr(-total / 2 - pad, -size * 0.72, total + pad * 2, size * 1.44, size * 0.4);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
  let x = -total / 2;
  ch.forEach((w, i) => {
    const active = vt >= w.s - 0.03 && vt < (i + 1 < ch.length ? ch[i + 1].s - 0.03 : w.e + 0.45);
    const said = vt >= w.s - 0.03;
    const k = active ? 1 + 0.12 * (1 - clamp((vt - w.s) / 0.18, 0, 1)) : 1;
    ctx.save();
    ctx.translate(x + widths[i] / 2, 4);
    ctx.scale(k, k);
    txt(words[i], 0, 0, { size, stroke: Math.round(size * 0.2), color: active ? '#ffd400' : said ? '#ffffff' : 'rgba(255,255,255,.55)' });
    ctx.restore();
    x += widths[i] + gap;
  });
  ctx.restore();
}

// ---------- kare çizimi ----------
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  background(t);
  const inS = (k) => t >= SC[k][0] && t < SC[k][1];
  if (inS('hook')) sceneHook(t - SC.hook[0]);
  else if (inS('chat')) sceneChat(t - SC.chat[0]);
  else if (inS('press')) scenePress(t - SC.press[0]);
  else if (inS('goal')) sceneGoal(t - SC.goal[0]);
  else if (inS('screen')) sceneScreen(t - SC.screen[0]);
  else if (inS('celebs')) sceneCelebs(t - SC.celebs[0]);
  else sceneCta(t - SC.cta[0]);
  wipe(t);
  subtitles(t);
  // hafif vinyet
  const v = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  return true;
}

// ================== SES ==================
async function renderAudio() {
  const SR = 44100;
  const ac = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.9;
  master.connect(comp).connect(ac.destination);
  const music = ac.createGain(); music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(master);
  // yankı
  const rev = ac.createConvolver(); const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }
  rev.buffer = ir; const revG = ac.createGain(); revG.gain.value = 0.22; rev.connect(revG).connect(master);
  sfx.connect(rev);
  const nb = ac.createBuffer(1, SR * 3, SR); { const d = nb.getChannelData(0); let l = 0; for (let i = 0; i < d.length; i++) { l = 0.96 * l + 0.04 * (Math.random() * 2 - 1); d[i] = l * 5 + (Math.random() * 2 - 1) * 0.15; } }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const env = (g, t, pk, a, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(pk, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const osc = (type, f, t, stop, dest) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dest); o.start(t); o.stop(stop); return o; };
  const noise = (t, dur, dest) => { const s = ac.createBufferSource(); s.buffer = nb; s.connect(dest); s.start(t, Math.random(), dur); };
  const filt = (type, f, q = 0.7) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };

  // --- müzik: 122 BPM, Am-F-C-G ---
  const BPM = 122, B = 60 / BPM;
  const CH = [[57, 60, 64, 45], [53, 57, 60, 41], [55, 60, 64, 48], [55, 59, 62, 43]];
  const kick = (t, v = 1) => { const g = ac.createGain(); g.connect(music); env(g, t, 0.9 * v, 0.003, 0.32); const o = osc('sine', 140, t, t + 0.4, g); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); };
  const clap = (t, v = 1) => { const g = ac.createGain(); const f = filt('bandpass', 1400, 0.9); f.connect(g).connect(music); env(g, t, 0.35 * v, 0.003, 0.16); noise(t, 0.2, f); };
  const hat = (t, v = 1) => { const g = ac.createGain(); const f = filt('highpass', 7500); f.connect(g).connect(music); env(g, t, 0.09 * v, 0.002, 0.05); noise(t, 0.07, f); };
  const bass = (m, t, len) => { const g = ac.createGain(); const f = filt('lowpass', 420); f.connect(g).connect(music); env(g, t, 0.42, 0.01, len); osc('sawtooth', mtof(m), t, t + len + 0.05, f); osc('sine', mtof(m - 12), t, t + len + 0.05, g); };
  const stab = (notes, t, v = 1) => { notes.forEach((m) => { const g = ac.createGain(); const f = filt('lowpass', 2600); f.connect(g).connect(music); env(g, t, 0.07 * v, 0.005, 0.28); osc('sawtooth', mtof(m + 12), t, t + 0.35, f); osc('square', mtof(m + 12) * 1.005, t, t + 0.35, f); }); };
  const pluck = (m, t, v = 1) => { const g = ac.createGain(); g.connect(music); env(g, t, 0.09 * v, 0.004, 0.22); osc('triangle', mtof(m), t, t + 0.3, g); };
  const pad = (notes, t, len) => { notes.forEach((m) => { const g = ac.createGain(); const f = filt('lowpass', 1200); f.connect(g).connect(music); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.035, t + 0.5); g.gain.linearRampToValueAtTime(0.0001, t + len); osc('sawtooth', mtof(m), t, t + len, f); osc('sawtooth', mtof(m) * 1.004, t, t + len, f); }); };

  const start = C.takimini - 0.04; // müzik topun yere çarptığı anda başlar
  const gStart = SC.goal[0], gHit = C.gol; // "Tur bitiyor... üç, iki, bir" boyunca davul susar
  for (let bt = start; bt < DUR - 0.6; bt += B) {
    const beat = Math.round((bt - start) / B);
    const bar = Math.floor(beat / 4);
    const ch = CH[bar % 4];
    const inBreak = bt >= gStart - 0.02 && bt < gHit - 0.02; // geri sayım: davul yok
    const intro = bt < SC.chat[0];
    if (beat % 4 === 0) { pad(ch.slice(0, 3), bt, B * 4); if (!inBreak) bass(ch[3], bt, B * 0.9); }
    if (inBreak) continue;
    kick(bt, intro ? 0.8 : 1);
    if (beat % 2 === 1) clap(bt, intro ? 0.7 : 1);
    hat(bt + B / 2); if (!intro) hat(bt + B / 4, 0.5);
    if (!intro) {
      if (beat % 4 !== 0) bass(ch[3] + (beat % 2 ? 12 : 0), bt + B / 2, B * 0.4);
      stab(ch.slice(0, 3), bt + B / 2, beat % 2 ? 0.8 : 0.6);

      pluck(arp[beat % 4], bt, 0.8); pluck(arp[(beat + 2) % 4], bt + B / 2, 0.6);
    }
  }

  const FULL = 0.85, DUCK = 0.36;
  const spans = [];
  for (const w of VO.words) {
    const a = w.s + VO_OFFSET - 0.08, b = w.e + VO_OFFSET + 0.12;
    if (spans.length && a - spans[spans.length - 1][1] < 0.4) spans[spans.length - 1][1] = b; else spans.push([a, b]);
  }
  music.gain.setValueAtTime(FULL, 0);
  for (const [a, b] of spans) {
    music.gain.setValueAtTime(FULL, Math.max(0, a - 0.06));
    music.gain.linearRampToValueAtTime(DUCK, a + 0.04);
    music.gain.setValueAtTime(DUCK, b);
    music.gain.linearRampToValueAtTime(FULL, b + 0.18);
  }
  music.gain.setValueAtTime(FULL, DUR - 1.4); music.gain.linearRampToValueAtTime(0.0001, DUR - 0.05);
  sfx.gain.value = 0.85;

  // --- efektler ---
  const whoosh = (t, v = 1) => { const g = ac.createGain(); const f = filt('bandpass', 400, 1.2); f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.35); f.connect(g).connect(sfx); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5 * v, t + 0.18); g.gain.linearRampToValueAtTime(0.0001, t + 0.45); noise(t, 0.5, f); };
  const boom = (t, v = 1) => { const g = ac.createGain(); g.connect(sfx); env(g, t, 0.9 * v, 0.005, 0.8); const o = osc('sine', 110, t, t + 0.9, g); o.frequency.exponentialRampToValueAtTime(34, t + 0.6); const g2 = ac.createGain(); const f = filt('lowpass', 2500); f.connect(g2).connect(sfx); env(g2, t, 0.35 * v, 0.002, 0.25); noise(t, 0.3, f); };
  const slam = (t, v = 1) => { boom(t, 0.55 * v); const g = ac.createGain(); const f = filt('highpass', 2500); f.connect(g).connect(sfx); env(g, t, 0.2 * v, 0.002, 0.12); noise(t, 0.15, f); };
  const pop = (t, m = 84) => { const g = ac.createGain(); g.connect(sfx); env(g, t, 0.28, 0.003, 0.12); const o = osc('sine', mtof(m - 12), t, t + 0.16, g); o.frequency.exponentialRampToValueAtTime(mtof(m + 7), t + 0.08); };
  const chime = (t, notes, gap = 0.06, v = 1) => notes.forEach((m, i) => { const tt = t + i * gap; const g = ac.createGain(); g.connect(sfx); env(g, tt, 0.16 * v, 0.004, 0.6); osc('sine', mtof(m), tt, tt + 0.7, g); const g2 = ac.createGain(); g2.connect(g); env(g2, tt, 0.3, 0.003, 0.3); osc('sine', mtof(m) * 2.01, tt, tt + 0.35, g2); });
  const cheer = (t, dur, v = 1) => { const g = ac.createGain(); const f = filt('bandpass', 900, 0.6); f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(1150, t + dur * 0.4); f.connect(g).connect(sfx); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32 * v, t + dur * 0.25); g.gain.linearRampToValueAtTime(0.22 * v, t + dur * 0.6); g.gain.linearRampToValueAtTime(0.0001, t + dur); noise(t, Math.min(dur, 2.9), f); noise(t + 0.05, Math.min(dur, 2.9), f); };
  const riser = (t, dur) => { const g = ac.createGain(); const f = filt('bandpass', 500, 2); f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(5000, t + dur); f.connect(g).connect(sfx); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.4, t + dur); noise(t, dur, f); const g2 = ac.createGain(); g2.connect(sfx); g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(0.1, t + dur); const o = osc('sawtooth', 200, t, t + dur, filt('lowpass', 3000)); o.disconnect(); const lp = filt('lowpass', 2500); o.connect(lp).connect(g2); o.frequency.exponentialRampToValueAtTime(1200, t + dur); };
  const whistle = (t, dur = 0.5) => { const g = ac.createGain(); g.connect(sfx); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.03); g.gain.setValueAtTime(0.12, t + dur - 0.05); g.gain.linearRampToValueAtTime(0.0001, t + dur); const o = osc('sine', 2900, t, t + dur, g); const l = ac.createOscillator(); const lg = ac.createGain(); l.frequency.value = 38; lg.gain.value = 140; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur); };
  const horn = (t, notes, gap, last, v = 1) => notes.forEach((m, i) => { const tt = t + i * gap; const len = i === notes.length - 1 ? last : gap * 0.9; const g = ac.createGain(); const f = filt('lowpass', 1900); f.connect(g).connect(sfx); g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(0.13 * v, tt + 0.04); g.gain.setValueAtTime(0.13 * v, tt + len - 0.06); g.gain.linearRampToValueAtTime(0.0001, tt + len + 0.12); osc('sawtooth', mtof(m), tt, tt + len + 0.15, f); osc('sawtooth', mtof(m) * 1.006, tt, tt + len + 0.15, f); });

  // ---- efektler: hepsi kelime zamanlarına bağlı ----
  const I = C.takimini - 0.04;
  { const g = ac.createGain(); g.connect(sfx); g.gain.setValueAtTime(0.0001, 0); g.gain.linearRampToValueAtTime(0.16, I - 0.05); g.gain.linearRampToValueAtTime(0.0001, I); const o = osc('sine', 1200, 0, I, g); o.frequency.exponentialRampToValueAtTime(260, I); }
  boom(I, 1.1); cheer(I + 0.05, 2.0, 0.55);
  slam(C.takimini, 0.8); slam(C.sen, 0.8); slam(C.sampiyon, 1.0);
  whoosh(C.sampiyon + 0.4, 0.4); pop(C.tiktok, 88);
  [0, 1, 2, 3].forEach((i) => pop(C.superlig + i * 0.12, 79 + i * 2));
  // sahne geçişleri
  ['chat', 'press', 'goal', 'screen', 'celebs', 'cta'].forEach((k) => whoosh(SC[k][0] - 0.22, 0.8));
  // yorumlar
  CHAT_T.forEach((t, i) => { pop(SC.chat[0] + t, 84 + (i % 3) * 3); chime(SC.chat[0] + t + 0.25, [91], 0, 0.35); });
  pop(C.plaka, 90);
  // hediyeler
  GIFT_T.forEach((t, i) => { whoosh(SC.press[0] + t - 0.45, 0.3); chime(SC.press[0] + t, i === 5 ? [79, 84, 88, 91, 96] : [84 + (i % 3) * 2, 91], 0.06, 0.8); });
  // geri sayım: "üç, iki, bir" kelimelerinde
  [C.uc, C.iki, C.bir].forEach((t, k) => { const g = ac.createGain(); g.connect(sfx); env(g, t, 0.2, 0.003, 0.16); osc('square', k === 2 ? 1320 : 880, t, t + 0.2, g); });
  riser(C.goal + 0.2, C.gol - C.goal - 0.2);
  // GOL
  whistle(C.gol - 0.06, 0.3);
  boom(C.gol, 1.3); cheer(C.gol, 3.4, 1.15);
  horn(C.gol + 0.12, [67, 72, 76, 79], 0.11, 0.45, 0.55);
  for (let i = 0; i < 8; i++) { const t = C.gol + 0.5 + i * 0.16; const g = ac.createGain(); g.connect(sfx); env(g, t, 0.05, 0.004, 0.08); const o = osc('sine', 2300 + (i % 3) * 300, t, t + 0.12, g); o.frequency.exponentialRampToValueAtTime(3200, t + 0.08); }
  pop(C.yuzde, 76); pop(C.gecen + 0.3, 79); pop(C.gecen + 0.85, 83);
  // gerçek ekran
  whoosh(SC.screen[0] + 0.05, 0.6); slam(SC.screen[0] + 0.7, 0.5);
  pop(C.tablo, 86); whoosh(C.tablo - 0.1, 0.35); pop(C.hafta, 88); whoosh(C.hafta - 0.1, 0.35);
  // kutlamalar
  [0, 1, 2, 3].forEach((j) => pop(SC.celebs[0] + 0.35 + j * 0.28, 81 + j * 2));
  { const mel = [76, 74, 76, 77, 76, 74, 72, 74]; mel.forEach((m, i) => { const t = C.horon + i * 0.1; const g = ac.createGain(); const f = filt('bandpass', 1500, 0.8); f.connect(g).connect(sfx); env(g, t, 0.14, 0.01, 0.09); osc('sawtooth', mtof(m), t, t + 0.12, f); }); }
  boom(C.aslan, 0.8); { const t = C.aslan; const g = ac.createGain(); const f = filt('lowpass', 420); f.connect(g).connect(sfx); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.26, t + 0.12); g.gain.linearRampToValueAtTime(0.0001, t + 0.6); noise(t, 0.65, f); const o = osc('sawtooth', 90, t, t + 0.65, f); o.frequency.linearRampToValueAtTime(65, t + 0.6); }
  [0, 0.2, 0.4].forEach((d) => boom(C.timsah + d, 0.4));
  [0, 0.15, 0.3].forEach((d, i) => { const t = C.yigido + d; const g = ac.createGain(); const f = filt('bandpass', i === 2 ? 700 : 950, 0.9); f.connect(g).connect(sfx); env(g, t, i === 2 ? 0.4 : 0.28, 0.02, i === 2 ? 0.35 : 0.14); noise(t, 0.45, f); boom(t, 0.3); });
  [C.horon, C.aslan, C.timsah, C.yigido].forEach((t) => whoosh(t - 0.14, 0.4));
  // kapanış
  boom(C.cta - 0.1, 1.0); horn(C.cta - 0.05, [60, 64, 67, 72], 0.12, 0.6, 0.5);
  cheer(C.cta, 3.6, 0.8);
  boom(C.saat + 0.15, 0.9); chime(C.saat + 0.15, [84, 88, 91, 96], 0.07, 0.8);
  pop(C.takipEt, 88); chime(C.takipEt + 0.05, [91, 96], 0.08, 0.7);
  boom(DUR - 1.1, 0.8);

  const buf = await ac.startRendering();
  // WAV (16 bit)
  const n = buf.length, ch = 2, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let o = 44; for (let i = 0; i < n; i++) { out.setInt16(o, clamp(L[i], -1, 1) * 32767, true); out.setInt16(o + 2, clamp(R[i], -1, 1) * 32767, true); o += 4; }

  for (let i = 0; i < bytes.length; i += CHK) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHK));
  return btoa(bin);
}

window.renderFrame = renderFrame;
window.renderAudio = renderAudio;
window.ready = Promise.all([document.fonts.load(`800 60px ${FONT}`), document.fonts.load(`600 60px ${FONT}`), new Promise((r) => { if (shot.complete) r(); else { shot.onload = r; shot.onerror = r; } })]);
// Tarayıcıda açınca önizleme olarak oynat
if (!navigator.webdriver) { const t0 = performance.now(); (function loop(now) { renderFrame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); })(t0); }
