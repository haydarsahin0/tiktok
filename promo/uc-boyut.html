<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Taraftar Ligi 3D tanıtım</title>
<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 600; src: url(fonts/baloo-2-latin-ext-600-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+0130-0131, U+015E-015F, U+011E-011F; }
  html, body { margin: 0; background: #000; }
  canvas#c { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
/* Taraftar Ligi — 3D döngülü tanıtım (1080x1920, 30 fps, ~22 sn).
 * Kamera kesintisiz tek plan halinde stadyumda uçar; son kare ilk kareye (gökyüzü açısı) bağlanır.
 * Puan tablosu ve fikstür oyunun gerçek Süper Lig verisinden gelir.
 * renderFrame(t) deterministiktir; renderAudio() müziği ve efektleri üretir; render.cjs MP4 yapar. */
import * as THREE from './vendor/three.module.min.js';
import { TEAMS } from '../public/core/teams.js';
import { baseStandings, pendingWeeks, sortTable } from '../public/core/matchday.js';

const W = 1080, H = 1920, FPS = 30;
const FONT = '"Baloo 2", "Segoe UI", Arial, sans-serif';
const EMO = '"Noto Color Emoji", "Apple Color Emoji", sans-serif';
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const main = document.getElementById('c');
const M = main.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const ACC = mk(), BL = mk(270, 480);
let ctx = M;

// ---------- seslendirme zamanları ----------
const getJSON = (u) => { const x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return JSON.parse(x.responseText); };
const VO = getJSON('uc-boyut-cues.json');
// Ekrandaki saat yazısı (seslendirmeden bağımsız, istenince değiştirilebilir)
const SAAT = { ana: '22:00', alt: 'TÜRKİYE SAATİ • ALMANYA 20:00' };
const PROMO = { vo: 'uc-boyut-ses.mp3', voOffset: 0, voTrim: VO.trim, voGain: 2.4, out: 'taraftar-ligi-3d.mp4' };
const norm = (w) => w.toLocaleLowerCase('tr-TR').replace(/[^a-zçğıöşü0-9']/g, '');
function cue(word, nth = 1) { let k = 0; for (const w of VO.words) if (norm(w.w) === norm(word) && ++k === nth) return w.s; throw new Error('kelime yok: ' + word); }
const C = {
  seksen: cue('Seksen'), tek: cue('tek'), stadyumda: cue('stadyumda'),
  gercek: cue('Gerçek'), tablosu: cue('tablosu'), canli: cue('canlı'),
  haftanin: cue('Haftanın'), maclari: cue('maçları'), ayni: cue('aynı'), oynaniyor: cue('oynanıyor'),
  yoruma: cue('Yoruma'), yaz: cue('yaz'), sahaya: cue('sahaya'), cik: cue('çık'),
  hediye: cue('Hediye'), begeni: cue('beğeni'), takip: cue('takip'), hepsi: cue('hepsi'), baski: cue('baskı'),
  baski2: cue('baskı', 2), yuzde: cue('yüzde'), besi: cue('beşi'), gecerse: cue('geçerse'), gol: cue('gol'),
  her: cue('Her'), her2: cue('Her', 2), tabloyu: cue('tabloyu'), aninda: cue('anında'), degistirir: cue('değiştirir'),
  aksam: cue('akşam'), canli2: cue('canlı', 2), takipEt: cue('takip', 2), cunku: cue('çünkü'), gece: cue('gece'),
};
const DUR = Math.round((VO.duration + 0.3) * FPS) / FPS;
const KICK = C.gecerse + 0.2;

// ---------- matematik ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eIn = (t) => t * t * t;
const eInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const smooth = (t) => t * t * t * (t * (t * 6 - 15) + 10);
const bell = (t, a, b) => { const p = prog(t, a, b); return p <= 0 || p >= 1 ? 0 : Math.sin(p * Math.PI); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const fseed = (t) => Math.floor(t * FPS + 0.5);

// ---------- 2D yardımcılar (doku ve katman çizimi) ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 800, color = '#fff', align = 'center', stroke = 0, strokeColor = 'rgba(0,0,0,.85)', max = 0, alpha = 1, glow = 0, glowColor = '#000', grad = null, spacing = 0 } = o;
  let sz = size;
  ctx.font = `${weight} ${sz}px ${FONT}`; ctx.letterSpacing = spacing ? `${spacing}px` : '0px';
  if (max) while (sz > 10 && ctx.measureText(s).width > max) { sz -= 2; ctx.font = `${weight} ${sz}px ${FONT}`; }
  ctx.save(); ctx.globalAlpha *= alpha; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y + sz * 0.06); ctx.shadowBlur = 0; }
  if (grad) { const g = ctx.createLinearGradient(0, y - sz * 0.45, 0, y + sz * 0.4); grad.forEach((c, i) => g.addColorStop(i / (grad.length - 1), c)); ctx.fillStyle = g; } else ctx.fillStyle = color;
  ctx.fillText(s, x, y + sz * 0.06); ctx.restore(); ctx.letterSpacing = '0px';
}
const tw = (s, size) => { ctx.font = `800 ${size}px ${FONT}`; return ctx.measureText(s).width; };
function emoji(e, x, y, size, rot = 0, alpha = 1) {
  if (size < 2 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, 0, size * 0.04); ctx.restore();
}
function badge2d(tm, x, y, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = tm.colors[0]; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.fillStyle = tm.colors[1]; ctx.fillRect(x - r * 0.22, y - r, r * 0.44, r * 2); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.lineWidth = Math.max(3, r * 0.12); ctx.strokeStyle = '#fff'; ctx.stroke();
  txt(tm.code, x, y, { size: r * 0.7, stroke: Math.max(4, r * 0.22), max: r * 1.7 });
}
const GOLD = ['#fff7c2', '#ffd400', '#e09a00'];
function canvasTex(w, h, draw, opts = {}) {
  const c = mk(w, h); const prev = ctx; ctx = c.getContext('2d'); draw(ctx, w, h); ctx = prev;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.userData.canvas = c; return t;
}
function redraw(tex, draw) { const c = tex.userData.canvas; const prev = ctx; ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); draw(ctx, c.width, c.height); ctx = prev; tex.needsUpdate = true; }

// ---------- gerçek lig verisi ----------
const TM = Object.fromEntries(TEAMS.map((t) => [t.id, t]));
const WEEK = pendingWeeks().find((w) => w.matches.length >= 9) || pendingWeeks()[0];
const GOAL_MATCH = WEEK.matches.find((m) => m.home === 'ts' || m.away === 'ts') || WEEK.matches[0];
const SCORER = GOAL_MATCH.home === 'ts' || GOAL_MATCH.away === 'ts' ? 'ts' : GOAL_MATCH.home;
const OPP = GOAL_MATCH.home === SCORER ? GOAL_MATCH.away : GOAL_MATCH.home;
const ST0 = baseStandings();
const TABLE_A = sortTable(ST0);
const ST1 = JSON.parse(JSON.stringify(ST0));
ST1[SCORER].pts += 3; ST1[SCORER].w += 1; ST1[SCORER].p += 1; ST1[SCORER].gf += 1; ST1[OPP].p += 1; ST1[OPP].l += 1; ST1[OPP].ga += 1;
const TABLE_B = sortTable(ST1);
const ROWS = 10;
const SHOWN = TABLE_A.slice(0, ROWS).map((r) => r.id);
if (!SHOWN.includes(SCORER)) SHOWN[ROWS - 1] = SCORER;
const rankA = (id) => SHOWN.indexOf(id);
const orderB = [...SHOWN].sort((a, b) => TABLE_B.findIndex((r) => r.id === a) - TABLE_B.findIndex((r) => r.id === b));
const rankB = (id) => orderB.indexOf(id);
const rowOf = (tbl, id) => tbl.find((r) => r.id === id);

// ================== 3D SAHNE ==================
const glc = mk();
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x060b1c, 160, 520);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.5, 1500);
scene.add(new THREE.HemisphereLight(0xb8c8ff, 0x203020, 1.3));
const sun = new THREE.DirectionalLight(0xfff4dd, 2.2); sun.position.set(30, 80, 40); scene.add(sun);
const rim = new THREE.DirectionalLight(0x88aaff, 1.0); rim.position.set(-40, 30, -60); scene.add(rim);

const OBJ = {}; // güncellenecek nesneler
const additive = (o = {}) => new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, ...o });
function glowTex(col = '255,255,255') { return canvasTex(256, 256, (c) => { const g = c.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, `rgba(${col},1)`); g.addColorStop(0.25, `rgba(${col},.5)`); g.addColorStop(1, `rgba(${col},0)`); c.fillStyle = g; c.fillRect(0, 0, 256, 256); }); }
function sprite(tex, scale, o = {}) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, ...o })); s.scale.set(scale[0], scale[1], 1); return s; }

async function build() {
  // gökyüzü
  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, map: canvasTex(16, 512, (c) => { const g = c.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#01030a'); g.addColorStop(0.45, '#071433'); g.addColorStop(0.55, '#14204a'); g.addColorStop(1, '#02040a'); c.fillStyle = g; c.fillRect(0, 0, 16, 512); }) }));
  scene.add(sky);
  { const r = rng(4), n = 900, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const th = r() * Math.PI * 2, ph = r() * 1.2; pos.set([Math.cos(th) * Math.cos(ph) * 800, Math.sin(ph) * 800 + 40, Math.sin(th) * Math.cos(ph) * 800], i * 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8 }))); }

  // saha
  const pitchTex = canvasTex(1024, 1536, (c, w, h) => {
    c.fillStyle = '#0d3a1a'; c.fillRect(0, 0, w, h);
    const px = 56, py = 56, pw = w - 112, ph = h - 112;
    for (let i = 0; i < 14; i++) { c.fillStyle = i % 2 ? '#1f8a3a' : '#25a044'; c.fillRect(px, py + (i * ph) / 14, pw, ph / 14 + 1); }
    const g = c.createRadialGradient(w / 2, h / 2, 100, w / 2, h / 2, h * 0.7); g.addColorStop(0, 'rgba(255,255,230,.12)'); g.addColorStop(1, 'rgba(0,0,0,.35)'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 6;
    c.strokeRect(px, py, pw, ph); c.beginPath(); c.moveTo(px, h / 2); c.lineTo(px + pw, h / 2); c.stroke();
    c.beginPath(); c.arc(w / 2, h / 2, 90, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(w / 2, h / 2, 6, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
    for (const s of [-1, 1]) {
      const gy = s < 0 ? py : py + ph, d = s < 0 ? 1 : -1;
      c.strokeRect(w / 2 - 300, s < 0 ? gy : gy - 240, 600, 240); c.strokeRect(w / 2 - 136, s < 0 ? gy : gy - 80, 272, 80);
      c.beginPath(); c.arc(w / 2, gy + d * 160, 6, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(w / 2, gy + d * 160, 90, d > 0 ? 0.65 : Math.PI + 0.65, d > 0 ? Math.PI - 0.65 : -0.65); c.stroke();
    }
  });
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(76, 113), new THREE.MeshBasicMaterial({ map: pitchTex }));
  pitch.rotation.x = -Math.PI / 2; scene.add(pitch);

  // tribünler (oval kase)
  const crowdTex = canvasTex(512, 256, (c, w, h) => {
    c.fillStyle = '#0c1020'; c.fillRect(0, 0, w, h);
    const r = rng(9), pal = ['#c8102e', '#ffd400', '#1d4fbf', '#ffffff', '#7A1E48', '#00843D', '#f26522', '#5DADE2'];
    for (let row = 0; row < 26; row++) for (let x = 0; x < w; x += 9) {
      const y = row * 10 + 4; c.fillStyle = pal[(r() * pal.length) | 0]; c.globalAlpha = 0.35 + r() * 0.55;
      c.fillRect(x + r() * 3, y, 6, 6); c.fillRect(x + 1 + r() * 2, y + 6, 5, 3);
    }
    c.globalAlpha = 1; const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  }, { repeat: true });
  const AX = 44, AZ = 62, D = 40, H0 = 1.6, H1 = 34;
  const band = (N, Mrows, fn, mat) => {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= N; i++) for (let j = 0; j <= Mrows; j++) { const [x, y, z, u, v] = fn(i / N, j / Mrows); pos.push(x, y, z); uv.push(u, v); }
    for (let i = 0; i < N; i++) for (let j = 0; j < Mrows; j++) { const a = i * (Mrows + 1) + j, b = (i + 1) * (Mrows + 1) + j; idx.push(a, b, a + 1, b, b + 1, a + 1); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); scene.add(m); return m;
  };
  band(160, 12, (a, u) => { const th = a * Math.PI * 2; return [Math.cos(th) * (AX + u * D), H0 + u * (H1 - H0) + (u > 0.5 ? 1.5 : 0), Math.sin(th) * (AZ + u * D), a * 30, 1 - u]; }, new THREE.MeshBasicMaterial({ map: crowdTex, side: THREE.DoubleSide }));
  // ön duvar ve LED reklam panoları
  const ledTex = canvasTex(1024, 64, (c, w, h) => { c.fillStyle = '#05060c'; c.fillRect(0, 0, w, h); txt('TARAFTAR LİGİ  •  CANLI  •  ', 0, h / 2, { size: 46, align: 'left', color: '#ffd400' }); txt('SÜPER LİG  •', 640, h / 2, { size: 46, align: 'left', color: '#ff2b4a' }); }, { repeat: true });
  OBJ.led = ledTex;
  band(160, 1, (a, u) => { const th = a * Math.PI * 2; return [Math.cos(th) * (AX - 1.2), u * 1.6, Math.sin(th) * (AZ - 1.2), a * 12, u]; }, new THREE.MeshBasicMaterial({ map: ledTex, side: THREE.DoubleSide }));
  // çatı ve çatı LED şeridi
  band(160, 1, (a, u) => { const th = a * Math.PI * 2, r = lerp(0, -16, u); return [Math.cos(th) * (AX + D + 3 + r), 42 + u * 3, Math.sin(th) * (AZ + D + 3 + r), a, u]; }, new THREE.MeshLambertMaterial({ color: 0x1a1f2e, side: THREE.DoubleSide }));
  const led2 = canvasTex(1024, 64, (c, w, h) => { c.fillStyle = '#06070d'; c.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 256) { txt('81 İL', x + 20, h / 2, { size: 44, align: 'left', color: '#25F4EE' }); txt('TEK STADYUM', x + 130, h / 2, { size: 44, align: 'left', color: '#fff' }); } }, { repeat: true });
  OBJ.led2 = led2;
  band(160, 1, (a, u) => { const th = a * Math.PI * 2; return [Math.cos(th) * (AX + D + 3), 37 + u * 5, Math.sin(th) * (AZ + D + 3), a * 16, u]; }, new THREE.MeshBasicMaterial({ map: led2, side: THREE.DoubleSide }));

  // projektörler
  const glowW = glowTex('255,250,225');
  OBJ.flood = [];
  for (const th of [0.75, 2.39, 3.89, 5.53]) {
    const x = Math.cos(th) * (AX + D + 8), z = Math.sin(th) * (AZ + D + 8);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.1, 66, 8), new THREE.MeshLambertMaterial({ color: 0x2a2f3f })); pole.position.set(x, 33, z); scene.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(14, 7, 1), new THREE.MeshBasicMaterial({ color: 0xfffbe6 })); head.position.set(x, 68, z); head.lookAt(0, 0, 0); scene.add(head);
    const gl = sprite(glowW, [70, 70], { blending: THREE.AdditiveBlending, opacity: 0.9, fog: false }); gl.position.set(x, 68, z); scene.add(gl);
    const len = Math.hypot(x, 68, z) * 0.95;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(30, len, 24, 1, true), additive({ color: 0xfff6d8, opacity: 0.05, side: THREE.DoubleSide }));
    cone.position.set(x * 0.52, 68 * 0.52, z * 0.52); cone.lookAt(0, 0, 0); cone.rotateX(-Math.PI / 2); scene.add(cone);
    OBJ.flood.push(gl);
  }

  // 81 plaka ışığı
  OBJ.plates = [];
  const pl = rng(81);
  for (let i = 0; i < 81; i++) {
    const n = String(i + 1).padStart(2, '0');
    const tex = canvasTex(160, 96, (c, w, h) => { const g = c.createRadialGradient(w / 2, h / 2, 5, w / 2, h / 2, w / 2); g.addColorStop(0, 'rgba(255,40,70,.95)'); g.addColorStop(1, 'rgba(255,40,70,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); rr(26, 18, 108, 60, 14); c.fillStyle = '#fff'; c.fill(); txt(n, w / 2, h / 2, { size: 50, color: '#c4001f' }); });
    const s = sprite(tex, [5.5, 3.3], { fog: false });
    const th = Math.PI / 2 + (i / 81) * Math.PI * 2, u = 0.25 + pl() * 0.55;
    s.position.set(Math.cos(th) * (AX + u * D), H0 + u * (H1 - H0) + 3, Math.sin(th) * (AZ + u * D));
    s.userData = { t: 0.05 + (i / 81) * 1.35 + pl() * 0.08, base: [5.5, 3.3] };
    scene.add(s); OBJ.plates.push(s);
  }

  // 3D katmanlı yazılar (gerçek derinlik: önde renkli yüz, arkada koyu katmanlar)
  function text3D(str, size, grad, side = '#5a2a00', layers = 14) {
    const cw = 2048, chh = 400;
    const draw = (c, w, h, fill) => { txt(str, w / 2, h / 2, { size: 300, grad: fill ? grad : null, color: fill ? '#fff' : '#fff', stroke: fill ? 18 : 0, strokeColor: '#1a0a00', max: w - 60 }); };
    const front = canvasTex(cw, chh, (c, w, h) => draw(c, w, h, true));
    const mask = canvasTex(cw, chh, (c, w, h) => draw(c, w, h, false));
    const g = new THREE.Group();
    const geo = new THREE.PlaneGeometry(size * (cw / chh), size);
    for (let k = layers; k >= 0; k--) {
      const col = new THREE.Color(side).lerp(new THREE.Color('#000'), k / layers * 0.6);
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: k ? mask : front, color: k ? col : 0xffffff, transparent: true, alphaTest: 0.35, depthWrite: true, side: THREE.DoubleSide, fog: false }));
      m.position.z = -k * size * 0.018; g.add(m);
    }
    scene.add(g); return g;
  }
  OBJ.t81 = text3D('81 İL', 16, GOLD);
  OBJ.tTek = text3D('TEK STADYUM', 7, ['#ffffff', '#dff6ff', '#9fd8ff'], '#0a2a55');
  OBJ.tGol = text3D('GOL!', 2.6, ['#fffbd0', '#FFED00', '#ffb800'], '#0a2a66');

  // ---- puan tablosu ----
  OBJ.table = new THREE.Group(); OBJ.table.position.set(0, 17.5, 0); scene.add(OBJ.table);
  const rowTex = (id, tbl, rank) => canvasTex(1100, 100, (c, w, h) => {
    const r = rowOf(tbl, id), tm = TM[id];
    const g = c.createLinearGradient(0, 0, w, 0); g.addColorStop(0, id === SCORER && tbl === TABLE_B ? '#8a5a00' : '#101a33'); g.addColorStop(1, id === SCORER && tbl === TABLE_B ? '#ffcc33' : '#18284d');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = tm.colors[0]; c.fillRect(0, 0, 14, h);
    txt(String(rank + 1), 60, h / 2, { size: 50, color: '#cfe0ff' });
    badge2d(tm, 140, h / 2, 34);
    txt(tm.short, 195, h / 2, { size: 52, align: 'left' });

const bez = (a, b, c, d, u) => { const v = 1 - u; return a.clone().multiplyScalar(v * v * v).add(b.clone().multiplyScalar(3 * v * v * u)).add(c.clone().multiplyScalar(3 * v * u * u)).add(d.clone().multiplyScalar(u * u * u)); };

function ballPos(t) {
  const start = V3(0, 0.55, -41.5), hit = V3(2.4, 2.1, -53.4);
  if (t < KICK) return start;
  const p = smooth(prog(t, KICK, C.gol));
  const v = start.clone().lerp(hit, p); v.y += Math.sin(p * Math.PI) * 1.6;
  if (t > C.gol) { const d = t - C.gol; v.z = hit.z - Math.min(1.3, d * 6) ; v.y = Math.max(0.55, hit.y - d * d * 6); }
  return v;
}

const FLASH = [[C.gol, 0.8, 0.35, '#fff'], [C.cik, 0.25, 0.15, '#fff'], [C.baski, 0.25, 0.15, '#ffb000'], [C.besi, 0.25, 0.2, '#1fbf5b']];

// ---------- kare çizimi ----------
function renderGL(t) { setScene(t); renderer.render(scene, camera); return glc; }
function renderFrame(t) {

}

// ================== SES ==================
async function renderAudio() {
  const SR = 44100, ac = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  const music = ac.createGain(); music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = 0.85; sfx.connect(master);
  const rev = ac.createConvolver(); const ir = ac.createBuffer(2, SR * 2, SR); { const R = rng(1); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / d.length, 3); } }

  const nb = ac.createBuffer(1, SR * 3, SR); { const d = nb.getChannelData(0); const R = rng(2); let l = 0; for (let i = 0; i < d.length; i++) { l = 0.96 * l + 0.04 * (R() * 2 - 1); d[i] = l * 5 + (R() * 2 - 1) * 0.15; } }

  const hat = (t, v = 1) => { const g = ac.createGain(); const f = filt('highpass', 7500); f.connect(g).connect(music); env(g, t, 0.09 * v, 0.002, 0.05); noise(t, 0.07, f); };
  const bass = (m, t, len, v = 1) => { const g = ac.createGain(); const f = filt('lowpass', 460); f.connect(g).connect(music); env(g, t, 0.42 * v, 0.01, len); osc('sawtooth', mtof(m), t, t + len + 0.05, f); osc('sine', mtof(m - 12), t, t + len + 0.05, g); };

  // döngü başı: drop darbesi (son riser buraya bağlanır)
  boom(0, 1.1); cheer(0, 2.2, 0.5);
  OBJ.plates.forEach((s, i) => { if (i % 3 === 0) { const t = s.userData.t; const g = ac.createGain(); g.connect(sfx); env(g, t, 0.05, 0.002, 0.08); osc('sine', mtof(84 + ((i / 3) % 12)), t, t + 0.1, g); } });
  boom(C.tek, 0.5); chime(C.tek + 0.02, [79, 86, 91], 0.05, 0.5);
  whoosh(C.stadyumda + 0.1, 0.9, 0.7);
  OBJ.rows.forEach((m) => whoosh(C.gercek - 0.25 + rankA(m.userData.id) * 0.07, 0.12, 0.3));
  pop(C.canli, 88); chime(C.canli + 0.05, [88, 95], 0.07, 0.6);
  whoosh(C.haftanin - 0.2, 0.7, 0.5); for (let i = 0; i < 9; i++) pop(C.haftanin - 0.1 + i * 0.07, 79 + (i % 5) * 2, 0.6);
  whoosh(C.haftanin + 0.4, 0.5, 2.2);

  whoosh(KICK - 0.25, 0.8, 0.5); thud(KICK, 1.2);
  riser(KICK + 0.05, C.gol - KICK - 0.07, 1.1);
  boom(C.gol, 1.5); cheer(C.gol, 3.0, 1.2); horn(C.gol + 0.1, [67, 72, 76, 79], 0.11, 0.5, 0.6);

  whoosh(C.tabloyu - 0.5, 0.7, 0.5); OBJ.rows.forEach((m) => whoosh(C.tabloyu - 0.45 + rankA(m.userData.id) * 0.04, 0.08, 0.3));
  whoosh(C.aninda - 0.1, 0.5, 0.6); boom(C.degistirir, 0.6); chime(C.degistirir + 0.05, [84, 88, 91, 96], 0.06, 0.6);

const PREVIEW = [0, 0.8, C.tek + 0.4, C.stadyumda + 0.5, C.tablosu + 0.3, C.canli + 0.2, C.maclari + 0.1, C.ayni + 0.4, C.oynaniyor + 0.3, C.yaz, C.cik + 0.3, C.hediye + 0.3, C.takip + 0.5,
